global:
  catalog:
    auth:
      dellDigitalMode: DEV
      dellDigitalURL: 
    public:
      enabled: true # indicates if public catalog is integrated.
      portal:
        baseURL: "https://dsp-portal.dev.automation.dell.com"
  dsp:
    enabled: true
    portal:
      enabled: false
      namespace: dsp-portal
      url: ''
      orgId: ''
      orchId: 'af9eae0b-8530-4e2b-a6a2-ea4934c515d6'
      token: ''
  ova:
    enabled: false
  containerRegistry:
    enabled: false # temporarily disable for McQueen
  eoName: "Dell Automation Platform Orchestrator"
  brandName: "Dell Automation Platform"
edge-orchestrator-services:
  hzp-catalog-svc:
    bootosInit:
      image:
        name: hzp-bootos-executable-exe-staging
fusion-services-helm:
  mgmtworker:
    env:
      CATALOG_TLS_VERIFY: "false"
  plugins:
    env:
      CATALOG_TLS_VERIFY: "false"
