{{- if .Values.servers.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
    chart: {{ template "pgadmin.chart" . }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
data:
  servers.json: |-
  {{ toJson .Values.servers.config | indent 4 }}
  {{- end }}