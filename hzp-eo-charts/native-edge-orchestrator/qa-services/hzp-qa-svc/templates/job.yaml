apiVersion: batch/v1
kind: Job
metadata:
  name: qa-db-init-job
spec:
  template:
    metadata:
      labels:
        hzp-app: hzp-qa-svc
        hzp.iam.webhook/active: "false"
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: db-init-container
        image: isgedge.artifactory.cec.lab.emc.com/isgedge-docker-virtual/bitnami/postgresql:15.10.0-debian-12-r2
        securityContext:
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        command: ["bash", "-c"]
        args:
        - |
          # Create the PostgreSQL database
          psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'hzp_qa_svc'" | grep -q 1 || psql -h postgres -U postgres -d postgres -c "CREATE DATABASE hzp_qa_svc ENCODING 'UTF8' LC_COLLATE 'en_US.UTF-8' LC_CTYPE 'en_US.UTF-8';"
          exit 0
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: hzpadmin-password
      restartPolicy: OnFailure
