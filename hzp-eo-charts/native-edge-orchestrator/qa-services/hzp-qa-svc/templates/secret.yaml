apiVersion: v1
kind: Secret
metadata:
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-4"
  namespace: {{ .Release.Namespace }}
  name: {{ .Values.global.dockerSecretQA.name }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.global.dockerSecretQA.dockerconfigjson }}
