global:
  nginx_gw:
    enabled: true
  imagePullSecretsMock:
    - name: docker-secret-qa
    - name: docker-secret
name: "mockserver"

replicaCount: 1

releasenameOverride: ""

app:
  logLevel: "INFO"
  serverPort: "443"
  mountedConfigMapName: "mockserver-config"
  mountedLibsConfigMapName: "mockserver-config"
  propertiesFileName: "mockserver.properties"
  serviceAccountName: default

image:
  name: &serviceName mockserver
  pullPolicy: Always
  tag: mockserver-5.14.0
  project: mockserver/

service:
  annotations: {}
  clusterIP: ""
  externalIPs: []
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  type: ClusterIP
  port: 443
  nodePort: ""
  test:
    image: radial/busyboxplus:curl

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mockserver.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

podLabels:
  release: '{{ .Release.Name }}'
  hzp-app: *serviceName
  hzp-role: eo-service
  hzp.iam.webhook/active: "{{ .Values.global.nginx_gw.enabled | quote }}"

podAnnotations:
  hzp.iam.webhook/authentication-enabled: "false"
  hzp.iam.webhook/authorization-enabled: "false"

resources: {}
