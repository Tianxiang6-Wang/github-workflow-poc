apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: all-to-mockserver
  namespace: {{ .Release.Namespace }}
spec:
  egress:
    - to:
        - podSelector:
            matchExpressions:
            - key: hzp-app
              operator: Exists              
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  ingress:
    - from:
        - podSelector:
            matchExpressions:
            - key: hzp-app
              operator: Exists             
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  podSelector:
    matchLabels:
      hzp-app: mockserver
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mockserver-to-all
  namespace: {{ .Release.Namespace }}
spec:  
  ingress:
    - from:
        - podSelector:
            matchLabels:
              hzp-app: mockserver
  egress:
    - to:
        - podSelector:
            matchLabels:
              hzp-app: mockserver
  podSelector:
    matchExpressions:
      - key: hzp-app
        operator: Exists
  policyTypes:
    - Ingress
    - Egress
