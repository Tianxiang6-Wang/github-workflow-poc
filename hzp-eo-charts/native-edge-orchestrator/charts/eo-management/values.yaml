global:
  delcosvc:
    deploy: true
  k8s:
    distro: k3s
  message:
    type: nats
    url: "nats://jetstream.{{ .Release.Namespace }}.svc.cluster.local:4222"
  iamAuthZEnabled: true
  iamV2AuthZEnabled: true
  efkStackEnabled: false
  ingress:
    fqdn: localhost
  imagePullSecrets:
    - &dockerSecretName docker-secret
  istio:
    ingress:
      ingressClassName: haproxy
  identityTopologyKey: hzp-node-identity
  identityGroupLabel: hzp-identity-group
  identityGroupLabelVaultValue: vault
  identityGroupLabelSpireValue: spire
  identityGroupLabelPostgresValue: postgres
  # Credentials for Artifactory
  dockerSecret:
    createSecret: true
    name: *dockerSecretName # pragma: allowlist secret
    dockerconfigjson: # pragma: allowlist secret
  # Passwords are auto-generated by default, but you can also set your own passwords.
  # Opensearch settings. Change this to use a remote opensearch cluster.
  dsp:
    enabled: false
    portal:
      namespace: "dapp"
  ova:
    enabled: false
  ip_mode: false

  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
  opensearch:
    deploy: true
    mode: ''
    awsRegion: ''
    host: 'eo-management-opensearch'
    port: 9200
    username: 'readOnly'
    password: ''
    tls: true
    verifyCerts: false
    statefulset:
      labels:
        app: opensearch
        release: eo-management
        chart: eo-management
        heritage: Helm
      podLabels:
        app: opensearch
        chart: eo-management
        heritage: Helm
        release: eo-management
        hzp-app: opensearch
        hzp-role: eo-service
        hzp.iam.webhook/active: "{{ .Values.global.nginx_gw.enabled | quote }}"
    job:
      annotations:
        "helm.sh/hook": post-install,post-upgrade
        "helm.sh/hook-weight": "-5"
        "helm.sh/hook-delete-policy": before-hook-creation
      labels:
        app: opensearch-manage
        release: mist-ee
        hzp-app: opensearch
        hzp-role: eo-service
      podLabels:
        app: opensearch-manage
        release: mist-ee
        hzp.iam.webhook/active: "true"
        sidecar.istio.io/inject: "false"
        hzp-app: opensearch
        hzp-role: eo-service
    resources:
      heapSize: "-Xms1g -Xmx1g"
      requests:
        memory: 1536Mi
        cpu: 50m
      limits:
        memory: 1536Mi
        cpu: 2000m
      storageSize: 8Gi
  postgresql:
    primary:
      containerSecurityContext:
        runAsUser: 1001
        runAsGroup: 1001
    metrics:
      containerSecurityContext:
        runAsUser: 1001
        runAsGroup: 1001
    readReplicas:
      containerSecurityContext:
        runAsUser: 1001
        runAsGroup: 1001
    deploy: true
    pullPolicy: Always
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - postgresql
            topologyKey: 'kubernetes.io/hostname'
    remote:
      user: ''
      host: ''
      port: ''
      password: '' # pragma: allowlist secret
    socketPath: /var/run/postgresql
    auth:
      secretName: postgres-secret # pragma: allowlist secret
      # Password for Postgres admin user. Username: 'postgres'
      postgresPassword: # pragma: allowlist secret
      # Password for the Keycloak database. Username: 'keycloak'
      keycloakDbPassword: # pragma: allowlist secret
    #when the postgresql.deploy will be false this block will be needed for create-postgresql-database-job
    upgrade:
      from: 14
      to: 15
      enabled: false
      podLabels:
        hzp-app: postgresql-upgrade
        hzp-role: eo-service
        hzp.iam.webhook/active: "false"
        sidecar.istio.io/inject: "false"
      restoreJob:
        podLabels:
          hzp-app: postgresql-upgrade
          hzp-role: eo-service
          app.kubernetes.io/component: psql_restore
          sidecar.istio.io/inject: "false"
        jobLabels:
          hzp-app: postgresql-upgrade
          hzp-role: eo-service
          app.kubernetes.io/component: psql_restore
          hzp.iam.webhook/authentication-enabled: "false"
          hzp.iam.webhook/authorization-enabled: "false"
      backupJob:
        podLabels:
          hzp-app: postgresql-upgrade
          hzp-role: eo-service
          app.kubernetes.io/component: pg_dumpall_backup
          sidecar.istio.io/inject: "false"
        jobLabels:
          hzp-app: postgresql-upgrade
          hzp-role: eo-service
          app.kubernetes.io/component: pg_dumpall_backup
          hzp.iam.webhook/authentication-enabled: "false"
          hzp.iam.webhook/authorization-enabled: "false"
      containers:
        image:
          repository: bitnami/kubectl
          tag: 1.27.16-debian-12-r0
      serviceAccountName: postgresql-upgrader
      storage:
        ## @param upgrade.storage.existingClaim Provide an existing `PersistentVolumeClaim` (only when `architecture=standalone`)
        ## If defined, PVC must be created manually before volume will be bound
        ##
        existingClaim: ""
        ## @param restore.job.storage.mountPath Path to mount the volume at
        mountPath: /bitnami/postgresql
        ## @param backup.cronjob.storage.subPath Subdirectory of the volume to mount at
        ## and one PV for multiple services.
        ##
        subPath: ""
      backup:
        configmap:
          annotations:
            "helm.sh/hook": pre-upgrade
            "helm.sh/hook-weight": "4"
        job:
          ## @param backup.cronjob.annotations Set the cronjob annotations
          annotations:
            "helm.sh/hook": pre-upgrade
            "helm.sh/hook-weight": "5"
          ## @param restore.job.ttlSecondsAfterFinished Set the cronjob parameter ttlSecondsAfterFinished
          ttlSecondsAfterFinished: ""
          ## restore container's Security Context
          ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
          ## @param restore.job.containerSecurityContext.runAsUser User ID for the backup container
          ## @param restore.job.containerSecurityContext.runAsGroup Group ID for the backup container
          ## @param restore.job.containerSecurityContext.runAsNonRoot Set backup container's Security Context runAsNonRoot
          ## @param restore.job.containerSecurityContext.readOnlyRootFilesystem Is the container itself readonly
          ## @param restore.job.containerSecurityContext.allowPrivilegeEscalation Is it possible to escalate backup pod(s) privileges
          ## @param restore.job.containerSecurityContext.seccompProfile.type Set backup container's Security Context seccompProfile type
          ## @param restore.job.containerSecurityContext.capabilities.drop Set backup container's Security Context capabilities to drop
          restartPolicy: Never
          containerSecurityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ## @param restore.job.command Set restore container's command to run
          command:
            - /bin/sh
            - -c
            - sh /scripts/backup.sh
      restore:
        job:
          ## @param restore.job.ttlSecondsAfterFinished Set the cronjob parameter ttlSecondsAfterFinished
          ttlSecondsAfterFinished: ""
          ## restore container's Security Context
          ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
          ## @param restore.job.containerSecurityContext.runAsUser User ID for the backup container
          ## @param restore.job.containerSecurityContext.runAsGroup Group ID for the backup container
          ## @param restore.job.containerSecurityContext.runAsNonRoot Set backup container's Security Context runAsNonRoot
          ## @param restore.job.containerSecurityContext.readOnlyRootFilesystem Is the container itself readonly
          ## @param restore.job.containerSecurityContext.allowPrivilegeEscalation Is it possible to escalate backup pod(s) privileges
          ## @param restore.job.containerSecurityContext.seccompProfile.type Set backup container's Security Context seccompProfile type
          ## @param restore.job.containerSecurityContext.capabilities.drop Set backup container's Security Context capabilities to drop
          restartPolicy: Never
          containerSecurityContext:
            runAsUser: 1001
            runAsGroup: 0
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ## @param upgrade.restore.job.command Set restore container's command to run
          command:
            - /bin/sh
            - -c
            - sh /scripts/restore.sh
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - postgresql
              topologyKey: "kubernetes.io/hostname"
  nginx_gw:
    enabled: false
  vault:
    deploy: true
    serviceName: edgevault
    socketDirPath: /var/run/vault
    socketPath: /var/run/vault/vault.sock
  keycloak:
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
    dbchecker:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
    deploy: true
    export: true
    scheme: http
    host: keycloak-http
    port: "80"
    bootstrapCredentials:
      secretName: ext-keycloak-secret # pragma: allowlist secret
      extUsername: # pragma: allowlist secret
      extPassword: # pragma: allowlist secret
    auth:
      secretName: keycloak-secret # pragma: allowlist secret
      # Password for the Keycloak admin. Username: 'keycloak'
      keycloakAdminPassword: # pragma: allowlist secret
      dellSecurityAdminUsrPassword: # pragma: allowlist secret
      automationClientPassword: # pragma: allowlist secret
      keycloakSecurityAdminUsrPassword: # pragma: allowlist secret
      keycloakAuthClientPassword: # pragma: allowlist secret
      keycloakIAMClientPassword: # pragma: allowlist secret
  pgadmin:
    auth:
      secretName: pgadmin-secret # pragma: allowlist secret
      # Password for the pgadmin admin. Username: 'admin@admin.com'
      pgAdminPassword: # pragma: allowlist secret
  fido:
    auth:
      secretName: fido-secret # pragma: allowlist secret
      # Password for the fido rv & owner.
      encryptPassword: # pragma: allowlist secret
      apiPassword: # pragma: allowlist secret
      sslPassword: # pragma: allowlist secret
  workflowEngine:
    auth:
      secretName: workflow-engine-secret # pragma: allowlist secret
      # Credential to access workflow-engine api
      apiPassword: # pragma: allowlist secret
  catalog:
    auth:
      secretName: catalog-secret #pragma: allowlist secret
      vaultSecretName: hzp-catalog-svc-vault-secret #pragma: allowlist secret
  test:
    enabled: false
  seaweedfs:
    enabled: true
    containerSecurityContext:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
    podSecurityContext:
      securityContext:
        fsGroup: 1001
  services:
    - name: keycloak
      m2m: true
      vault: true
      vaultPolicies: |-
        # policy for PKI
        path "pki/eo/*" {
          capabilities = ["read", "list", "create", "update", "patch", "delete"]
        }
    - name: hzp-attestation-svc
      m2m: true
      vault: true
    - name: mist
      m2m: true
      vault: false
    - name: hzp-notification-svc
      m2m: true
      vault: true
    - name: hzp-certificate-svc
      m2m: true
      vault: false
    - name: hzp-inventory-svc
      m2m: true
      vault: false
    - name: hzp-rules-svc
      m2m: true
      vault: true
    - name: hzp-metrics-svc
      m2m: true
      vault: true
    - name: hzp-iam-svc
      m2m: true
      vault: true
    - name: hzp-iam-session-svc
      m2m: true
      vault: true
      vaultPolicies: |-
        # policy for KV
        path "kv/eo/hzp-iam-session-svc/*" {
          capabilities = ["read", "list", "create", "update", "patch", "delete"]
        }
  temp:
    portalTransition:
      enableLoadBalancer: true
  oob:
    oobEnabled: false
    oobNodeToInterfaceList:
    oobLoadBalancerIP:
components:
  hzp-util:
    image: hzp-util
    version: 0.1.3
    project: hzp/
  busybox:
    image: busybox
    version: 1.37.0
    project: ''
seaweedfs:
  podLabels:
    hzp-app: seaweed
  master:
    volumeSizeLimitMB: 10000
    resources: |
      requests:
        memory: 128Mi
        cpu: 0.1
      limits:
        memory: 512Mi
        cpu: 0.5
    data:
      type: "persistentVolumeClaim"
      size: "1Gi"
    initContainers: |
      - name: pvc-chown
        image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
        command:
          - sh
          - '-c'
          - |
            chown -R {{ .Values.global.seaweedfs.containerSecurityContext.securityContext.runAsUser }}:{{ .Values.global.seaweedfs.containerSecurityContext.securityContext.runAsUser }} /data;
            echo 'Change ownership OK ✓'
        volumeMounts:
          - name: data-{{ .Release.Namespace }}
            mountPath: /data
        imagePullPolicy: {{ default "IfNotPresent" .Values.global.imagePullPolicy }}
        securityContext:
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
  filer:
    resources: |
      requests:
        memory: 128Mi
        cpu: 0.1
      limits:
        memory: 2Gi
        cpu: 1
    data:
      type: "persistentVolumeClaim"
      size: "1Gi"
    initContainers: |
      {{- if (or .Values.filer.enablePVC (or (eq .Values.filer.data.type "hostPath") (eq .Values.filer.data.type "persistentVolumeClaim"))) }}
      - name: pvc-chown
        image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
        command:
          - sh
          - '-c'
          - |
            chown -R {{ .Values.global.seaweedfs.containerSecurityContext.securityContext.runAsUser }}:{{ .Values.global.seaweedfs.containerSecurityContext.securityContext.runAsUser }} /data;
            echo 'Change ownership OK ✓'
        volumeMounts:
          - name: data-filer
            mountPath: /data
        imagePullPolicy: {{ default "IfNotPresent" .Values.global.imagePullPolicy }}
        securityContext:
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      {{- end }}
  s3:
    enabled: true
    enableAuth: true
    port: 8333
    resources: |
      requests:
        memory: 128Mi
        cpu: 0.1
      limits:
        memory: 512Mi
        cpu: 0.5
    affinity: ""
  volume:
    resources: |
      requests:
        memory: 256Mi
        cpu: 0.1
      limits:
        memory: 512Mi
        cpu: 0.5
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        maxVolumes: "100"
    # Keep this when upgrading seaweedfs in future
    # Volume pvc will use this value to allow for patching
    data:
      size: "100Gi"
    idx:
      size: "1Gi"
    initContainers: |
      {{- if or .Values.volume.dataDirs .Values.volume.idx .Values.volume.logs }}
      - name: pvc-chown
        image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
        command:
          - sh
          - '-c'
          - |
            {{- $runAsUser := .Values.global.seaweedfs.containerSecurityContext.securityContext.runAsUser | default 1001 }}
            {{- range $dir := .Values.volume.dataDirs }}
            chown -R {{ $runAsUser }}:{{ $runAsUser }} /{{ $dir.name }};
            {{- end }}
            {{- if .Values.volume.idx }}
            chown -R {{ $runAsUser }}:{{ $runAsUser }} /idx;
            {{- end }}
            {{- if .Values.volume.logs }}
            chown -R {{ $runAsUser }}:{{ $runAsUser }} /logs;
            {{- end }}
            echo 'Change ownership OK ✓'
        volumeMounts:
          {{- range $dir := .Values.volume.dataDirs }}
            - name: {{ $dir.name }}
              mountPath: "/{{ $dir.name }}/"
          {{- end }}
          {{- if .Values.volume.idx }}
            - name: idx
              mountPath: "/idx/"
          {{- end }}
        imagePullPolicy: {{ default "IfNotPresent" .Values.global.imagePullPolicy }}
        securityContext:
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      {{- end }}
