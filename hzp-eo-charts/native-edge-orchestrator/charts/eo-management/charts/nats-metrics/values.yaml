global:
  k8s:
    distro: k3s
  imagePullSecrets:
    - &dockerSecretName docker-secret
  storageClass:
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
components:
  busybox:
    image: busybox
    version: 1.37.0
    project: ''
  hzp-util:
    image: hzp-util
    version: 0.1.3
    project: hzp/
  nats:
    image: nats
    version: 2.10.25
    project: ''
nats:
  jetStream:
    domain: "eo_hub"
    pvc:
      resources:
        # Should be larger than the nats.jetStream.maxStorage.
        storage: "2Gi"
    service:
      fullname: jetstream-metrics
      port: 4222
    #2GiB maxMemory  
    maxMemory: "2147483648"
    maxStorage: "2147483648"
  job:
    createStreamMetricsNode:
      enabled: true
      podAnnotations:
      podLabels:
        hzp-app: "nats-create-stream-metricsnode-job"
        hzp-role: "eo-service"
      pullPolicy: IfNotPresent
      # max memory for each stream. Total memory should be less than nats.jetStream.maxMemory
      maxMemory:
        metrics: "2GiB"
      # retention for all streams
      retention: "3d"
  
