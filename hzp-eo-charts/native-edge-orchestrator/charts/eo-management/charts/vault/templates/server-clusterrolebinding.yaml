{{ template "vault.serverAuthDelegator" . }}
{{- if .serverAuthDelegator -}}
{{- if .Capabilities.APIVersions.Has "rbac.authorization.k8s.io/v1" -}}
apiVersion: rbac.authorization.k8s.io/v1
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1beta1
{{- end }}
kind: RoleBinding
metadata:
  name: "{{ tpl .Values.global.clusterResourcesPrefix . }}{{ template "vault.fullname" . }}-server-binding"
  labels:
    helm.sh/chart: {{ include "vault.chart" . }}
    app.kubernetes.io/name: {{ include "vault.name" . }}
    app.kubernetes.io/instance: eo-management
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    env: "{{ .Release.Namespace }}"
    name: "{{ template "vault.fullname" . }}-server-binding"
    globalName: "{{ tpl .Values.global.clusterResourcesPrefix . }}{{ template "vault.fullname" . }}-server-binding"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: {{ template "vault.serviceAccount.name" . }}
  namespace: {{ .Release.Namespace }}
{{ end }}
