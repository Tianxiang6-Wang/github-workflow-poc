{{- if eq (include "isDelcoSvcDisabled" .) "false" }}
{{- $svc := .Values.svc -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  annotations: 
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": "before-hook-creation"
spec:
  selector:
    hzp-app: {{ $svc.name }}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: {{ $svc.port }}
{{ end }}
