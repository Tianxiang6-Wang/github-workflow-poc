apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "registry.name" . }}
  labels:
    app.kubernetes.io/app: {{ template "registry.name" . }}
    app.kubernetes.io/instance: {{ template "registry.name" . }}-instance
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/managed-by: helm
{{- if .Values.deployment.annotations }}
  annotations:
{{ toYaml .Values.deployment.annotations | indent 4 }}
{{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/app: {{ template "registry.name" . }}
      helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
      app.kubernetes.io/instance: {{ template "registry.name" . }}-instance
  template:
    metadata:
      labels:
        app.kubernetes.io/app:  {{ template "registry.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ template "registry.name" . }}-instance
        hzp.iam.webhook/active: {{ .Values.global.nginx_gw.enabled | quote }}
        {{- with .Values.podLabels }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "images.pullSecrets" . | nindent 6 }}
      {{- if .Values.securityContext.enabled }}
      securityContext: {{ omit .Values.securityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: {{ default .Values.global.restartPolicy .Values.registry.restartPolicy }}
      containers:
        - name: {{ template "registry.name" . }}
          image: {{ include "manifest.image.name" (dict "data" (index .Values.components "registry" ) "repo" .Values.global.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.containerPort }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.containerPort }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          env: {{ include "registry.envs" . | nindent 12 }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{ omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          volumeMounts: {{ include "registry.volumeMounts" . | nindent 12 }}
      {{- if .Values.registry.nodeSelector }}
      nodeSelector:
        {{ tpl .Values.registry.nodeSelector . | indent 8 | trim }}
      {{- end }}
      affinity: {{- include "pods.affinity" ( list .Values.svc $ ) | trim | nindent 8 }}
      {{- if .Values.registry.tolerations }}
      tolerations:
        {{ tpl .Values.registry.tolerations . | nindent 8 | trim }}
      {{- end }}
      volumes: {{ include "registry.volumes" . | nindent 8 }}
