prometheus:
  alertmanager:
    enabled: false
  enableNetworkPolicy: true
  enabled: false
  fullnameOverride: prometheus
  podLabels: {}
  server:
    alertingRules:
      groups:
      - name: postgresql
        rules:
        - expr: pg_up{job="postgresql-metrics"} > 0 and up{job="postgresql-metrics"}
            > 0
          labels: null
          record: postgresql_healthy
        - alert: postgresql_down
          annotations:
            summary: PostgreSQL is down
          expr: pg_up{job="postgresql-metrics"} == 0 or absent(up{job="postgresql-metrics"})
          for: 15s
          labels:
            severity: critical
      - name: rabbitmq
        rules:
        - expr: sum by(host, instance, job, monitor) (up{job="rabbitmq-metrics"})
            > 0
          labels: null
          record: rabbitmq_healthy
        - alert: rabbitmq_down
          annotations:
            summary: RabbitMQ is down
          expr: up{job="rabbitmq-metrics"} == 0
          for: 15s
          labels:
            severity: critical
    configuration: "global:\n  {{- if .Values.server.scrapeInterval }}\n  scrape_interval:\
      \ {{ .Values.server.scrapeInterval }}\n  {{- end }}\n  {{- if .Values.server.scrapeTimeout\
      \ }}\n  scrape_timeout: {{ .Values.server.scrapeTimeout }}\n  {{- end }}\n \
      \ {{- if .Values.server.evaluationInterval }}\n  evaluation_interval: {{ .Values.server.evaluationInterval\
      \ }}\n  {{- end }}\n  external_labels:\n    monitor: {{ template \"common.names.fullname\"\
      \ . }}\n    {{- if .Values.server.externalLabels }}\n    {{- include \"common.tplvalues.render\"\
      \ (dict \"value\" .Values.server.externalLabels \"context\" $) | nindent 4 }}\n\
      \    {{- end }}\n{{- if .Values.server.remoteWrite }}\nremote_write: {{- include\
      \ \"common.tplvalues.render\" (dict \"value\" .Values.server.remoteWrite \"\
      context\" $) | nindent 4 }}\n{{- end }}\nscrape_configs:\n  - job_name: prometheus\n\
      \  {{- include \"prometheus.scrape_config\" (dict \"component\" \"server\" \"\
      context\" $) | nindent 4 }}\n{{- if .Values.alertmanager.enabled }}\n  - job_name:\
      \ alertmanager\n    {{- include \"prometheus.scrape_config\" (dict \"component\"\
      \ \"alertmanager\" \"context\" $) | nindent 4 }}\n{{- end }}\n{{- if .Values.server.extraScrapeConfigs}}\n\
      {{- include \"common.tplvalues.render\" (dict \"value\" .Values.server.extraScrapeConfigs\
      \ \"context\" $) | nindent 2 }}\n{{- end }}\n{{- if or .Values.alertmanager.enabled\
      \ .Values.server.alertingEndpoints}}\nalerting:\n  alertmanagers:\n    {{- if\
      \ .Values.server.alertingEndpoints }}\n    {{- include \"common.tplvalues.render\"\
      \ (dict \"value\" .Values.server.alertingEndpoints \"context\" $) | nindent\
      \ 4 }}\n    {{- end }}\n    - scheme: HTTP\n      static_configs:\n        -\
      \ targets: [ \"{{ printf \"%s.%s.svc.%s:%d\" (include \"prometheus.alertmanager.fullname\"\
      \ .) (include \"common.names.namespace\" .) .Values.clusterDomain (int .Values.alertmanager.service.ports.http)\
      \ }}\" ]\n{{- end }}\nrule_files:\n  - rules.yaml\n"
    evaluationInterval: 15s
    extraScrapeConfigs:
    - job_name: kube-state-metrics
      kubernetes_sd_configs:
      - namespaces:
          names:
          - '{{ .Release.Namespace }}'
        role: service
      relabel_configs:
      - action: keep
        regex: kube-state-metrics
        source_labels:
        - __meta_kubernetes_service_label_app_kubernetes_io_name
    - job_name: postgresql-metrics
      kubernetes_sd_configs:
      - namespaces:
          names:
          - '{{ .Release.Namespace }}'
        role: service
      relabel_configs:
      - action: keep
        regex: postgresql-metrics
        source_labels:
        - __meta_kubernetes_service_name
      - action: replace
        source_labels:
        - __meta_kubernetes_service_cluster_ip
        target_label: host
    - job_name: rabbitmq-metrics
      kubernetes_sd_configs:
      - namespaces:
          names:
          - '{{ .Release.Namespace }}'
        role: service
      relabel_configs:
      - action: keep
        regex: rabbitmq
        source_labels:
        - __meta_kubernetes_service_label_app_kubernetes_io_name
      - action: keep
        regex: metrics
        source_labels:
        - __meta_kubernetes_service_port_name
      - action: replace
        source_labels:
        - __meta_kubernetes_service_cluster_ip
        target_label: host
    image:
      pullPolicy: IfNotPresent
      tag: 2.45.0
    persistence:
      enabled: true
    replicaCount: 1
    resources:
      limits:
        cpu: 0.3
        ephemeral-storage: 10Mi
        memory: 512Mi
      requests:
        cpu: 0.1
        memory: 512Mi
    scrapeInterval: 15s
    service:
      ports:
        http: 9090
      type: ClusterIP
rabbitmq:
