vault:
  appRolePath: approle
  authDelegator:
    enabled: false
  bootstrap:
    enabled: true
    jobTtl: 180
    kvMountPath: kv/fusion-svc
  componentName: fusion-svc
  enabled: false
  fullnameOverride: vault
  injector:
    enabled: false
  podSecurityContext:
    runAsGroup: 1000
    runAsUser: 1000
  server:
    extraSecretEnvironmentVars:
    - envName: VAULT_UNSEAL_KEYS
      secretKey: VAULT_UNSEAL_KEYS
      secretName: vault-unseal-keys
    ha:
      enabled: false
      raft:
        config: "ui = true\nlistener \"tcp\" {\n  tls_disable = 1\n  address = \"\
          [::]:8200\"\n  cluster_address = \"[::]:8201\"\n}\nstorage \"raft\" {\n\
          \  path = \"/vault/data\"\n  retry_join {\n    leader_api_addr = \"http://{{\
          \ template \"vault.fullname\" . }}-0.{{ template \"vault.fullname\" . }}-internal:8200\"\
          \n  }\n  retry_join {\n    leader_api_addr = \"http://{{ template \"vault.fullname\"\
          \ . }}-1.{{ template \"vault.fullname\" . }}-internal:8200\"\n  }\n  retry_join\
          \ {\n    leader_api_addr = \"http://{{ template \"vault.fullname\" . }}-2.{{\
          \ template \"vault.fullname\" . }}-internal:8200\"\n  }\n}\n"
        enabled: true
        setNodeId: true
      replicas: 3
    image:
      tag: 1.13.2
    postStart:
    - /bin/sh
    - -c
    - "for key in ${VAULT_UNSEAL_KEYS}; do\n  vault operator unseal ${key}\n  sleep\
      \ 1\ndone\n"
    resources:
      limits:
        cpu: 0.5
        memory: 256Mi
      requests:
        cpu: 0.1
        ephemeral-storage: 50Mi
        memory: 128Mi
    serviceAccount:
      create: false
      serviceDiscovery:
        enabled: false
