{{- if .Values.plugins.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "fusion-services.name" . }}-plugins-config
  annotations:
    {{- include "fusion-services.merge" ( list .Values.commonAnnotations "" ) | nindent 4 }}
data:
  config.yaml: |
    {{ .Values.plugins.config | toYaml | nindent 4 }}
{{- end }}
