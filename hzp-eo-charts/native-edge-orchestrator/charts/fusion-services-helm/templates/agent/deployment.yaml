{{- if .Values.agent.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: agent
  name: {{ template "fusion-services.name" . }}-agent
  annotations:
    {{- include "fusion-services.merge" ( list .Values.commonAnnotations "" ) | nindent 4 }}
spec:
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
      {{ with .Values.agent.podLabels }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        {{- include "fusion-services.merge" ( list .Values.commonAnnotations .Values.agent.podAnnotations ) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: {{ .Values.agent.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.agent.podSecurityContext.runAsGroup }}
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector: {{- include "fusion-services.nodeSelector" ( list .Values.agent $ )| trim | nindent 8 }}
      tolerations: {{- include "fusion-services.tolerations" ( list .Values.agent $ ) | trim | nindent 8 }}
      affinity: {{- include "fusion-services.affinity" ( list .Values.agent $ ) | trim | nindent 8 }}
      initContainers:
        - name: db-wait
          image: {{ include "fusion-services.image.name" (dict "svc" ( index .Values.components "fusion-manager-restservice" ) "repo" .Values.global.repository) }}
          imagePullPolicy: {{ default .Values.global.image.pullPolicy ( index .Values.components "fusion-manager-restservice" ).pullPolicy }}
          env:
            {{- include "fusion-services.postgres_env_vars" (dict "dbRoot" .Values.agent "root" $) | nindent 12 }}
          command:
            - /usr/bin/env
            - -S
            - bash
            - -exuc
            - |
              python -m manager_rest.configure_manager --db-wait {{ .Values.agent.db.host | default .Values.db.host }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: {{ .Values.agent.initContainerSecurityContext.runAsUser }}
            runAsGroup: {{ .Values.agent.initContainerSecurityContext.runAsGroup }}
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 256Mi
              cpu: "0.1"
            limits:
              memory: 512Mi
              cpu: "1"
        - name: agent-migrate-db
          image: {{ include "fusion-services.image.name" (dict "svc" ( index .Values.components "fusion-manager-agent-service" ) "repo" .Values.global.repository) }}
          imagePullPolicy: {{ default .Values.global.image.pullPolicy ( index .Values.components "fusion-manager-agent-service" ).pullPolicy }}
          env:
            {{- include "fusion-services.postgres_env_vars" (dict "dbRoot" .Values.agent "root" $) | nindent 12 }}
          command:
            - /usr/bin/env
            - -S
            - bash
            - -exuc
            - |
              cd /opt/manager/migrations
              alembic upgrade head
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: {{ .Values.agent.initContainerSecurityContext.runAsUser }}
            runAsGroup: {{ .Values.agent.initContainerSecurityContext.runAsGroup }}
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 256Mi
              cpu: "0.1"
            limits:
              memory: 512Mi
              cpu: "1"
      containers:
        - name: agent
          image: {{ include "fusion-services.image.name" (dict "svc" ( index .Values.components "fusion-manager-agent-service" ) "repo" .Values.global.repository) }}
          imagePullPolicy: {{ default .Values.global.image.pullPolicy ( index .Values.components "fusion-manager-agent-service" ).pullPolicy }}
          env:
            {{- if (.Values.agent.eventing).stream_url }}
            - name: NATS_URL
              value: {{ tpl .Values.agent.eventing.stream_url $ | quote}}
            {{- end }}
            - name: FUSION_AUTH_PSK
              valueFrom:
                secretKeyRef:
                  name: {{ template "fusion-services.name" . }}-auth-signing
                  key: psk
            {{- include "fusion-services.s3_env_vars" . | nindent 12 }}
            {{- include "fusion-services.postgres_env_vars" (dict "dbRoot" .Values.agent "root" $) | nindent 12 }}
            - name: LOGGING_LEVEL_CONFIGURATION_PATH
              value: {{ tpl .Values.agent.logging.configMountPath $}}
            - name: LOGGING_LEVEL_GLOBAL_PATH
              value: {{ tpl .Values.agent.logging.configMountPath $ }}/{{ tpl .Values.agent.logging.globalConfigFile $ }}
            - name: LOGGING_LEVEL_SERVICE_PATH
              value: {{ tpl .Values.agent.logging.configMountPath $ }}/{{ tpl .Values.agent.logging.serviceConfigFile $ }}
            {{- if (.Values.agent.eventing).stream_url }}
            - name: AUDIT_LOGS_SUBJECT
              value: {{ tpl .Values.agent.logging.audit_logs_subject $ | quote }}
            {{- end }}
            {{- if (.Values.global).useHzpMultitenancy }}
            - name: "HZP_MULTITENANCY"
              value: "true"
            {{- end }}
          volumeMounts:
            - name: logging
              mountPath: {{ tpl .Values.agent.logging.configMountPath $ }}
              readOnly: true
          ports:
            - containerPort: {{ .Values.agent.port }}
          envFrom:
            - configMapRef:
                name: {{ template "fusion-services.name" . }}-agent-envvars
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
          {{- if .Values.agent.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              port: {{ .Values.agent.port}}
              path: /health
            initialDelaySeconds: {{ .Values.agent.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.agent.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.agent.probes.liveness.timeoutSeconds }}
            successThreshold: {{ .Values.agent.probes.liveness.successThreshold }}
            failureThreshold: {{ .Values.agent.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.agent.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              port: {{ .Values.agent.port}}
              path: /health
            initialDelaySeconds: {{ .Values.agent.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.agent.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.agent.probes.readiness.timeoutSeconds }}
            successThreshold: {{ .Values.agent.probes.readiness.successThreshold }}
            failureThreshold: {{ .Values.agent.probes.readiness.failureThreshold }}
          {{- end }}
      restartPolicy: Always
      {{- include "fusion-services.images.pullSecrets" . | nindent 6 }}
      volumes:
        - name: logging
          configMap:
            name: {{ include "fusion-loglevel-configmap.name" $ }}
{{- end }}
