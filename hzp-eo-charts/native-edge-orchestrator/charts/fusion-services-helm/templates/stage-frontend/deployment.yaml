{{- if .Values.stage_frontend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: stage-frontend
  name: {{ template "fusion-services.name" . }}-stage-frontend
  annotations:
    {{- include "fusion-services.merge" ( list .Values.commonAnnotations "" ) | nindent 4 }}
spec:
  replicas: {{ .Values.stage_frontend.replicas }}
  selector:
    matchLabels:
      app: stage-frontend
  template:
    metadata:
      labels:
        app: stage-frontend
        fusion-name: stage-frontend
      {{ with .Values.stage_frontend.podLabels }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        {{- include "fusion-services.merge" ( list .Values.commonAnnotations .Values.stage_frontend.podAnnotations ) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: {{ .Values.stage_frontend.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.stage_frontend.podSecurityContext.runAsGroup }}
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector: {{- include "fusion-services.nodeSelector" ( list .Values.stage_frontend $ )| trim | nindent 8 }}
      tolerations: {{- include "fusion-services.tolerations" ( list .Values.stage_frontend $ ) | trim | nindent 8 }}
      affinity: {{- include "fusion-services.affinity" ( list .Values.stage_frontend $ ) | trim | nindent 8 }}
      containers:
        - image: {{ include "fusion-services.image.name" (dict "svc" ( index .Values.components "fusion-manager-stage-frontend" ) "repo" .Values.global.repository) }}
          imagePullPolicy: {{ default .Values.global.image.pullPolicy ( index .Values.components "fusion-manager-stage-frontend" ).pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          name: stage-frontend
          ports:
            - containerPort: {{ .Values.stage_frontend.port }}
          resources: {{- toYaml .Values.stage_frontend.resources | nindent 12 }}
          {{- if .Values.stage_frontend.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              port: {{ .Values.stage_frontend.port}}
              path: "/static/"
            initialDelaySeconds: {{ .Values.stage_frontend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.stage_frontend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.stage_frontend.probes.liveness.timeoutSeconds }}
            successThreshold: {{ .Values.stage_frontend.probes.liveness.successThreshold }}
            failureThreshold: {{ .Values.stage_frontend.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.stage_frontend.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              port: {{ .Values.stage_frontend.port}}
              path: "/static/"
            initialDelaySeconds: {{ .Values.stage_frontend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.stage_frontend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.stage_frontend.probes.readiness.timeoutSeconds }}
            successThreshold: {{ .Values.stage_frontend.probes.readiness.successThreshold }}
            failureThreshold: {{ .Values.stage_frontend.probes.readiness.failureThreshold }}
          {{- end }}
      restartPolicy: Always
      {{- include "fusion-services.images.pullSecrets" . | nindent 6 }}
{{- end -}}
