{{- if .Values.ingress.enabled -}}
{{- $httpPort := .Values.service.http.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "fusion-services.name" . }}-services-basic
  labels: {{ include "fusion-services.labels" . | nindent 4 }}
  annotations:
    {{- include "fusion-services.merge" ( list .Values.commonAnnotations .Values.ingress.annotations ) | nindent 4 }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
      - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.entrypoint.name }}
                port:
                  number: {{ .servicePort | default $httpPort }}
{{- end }}
