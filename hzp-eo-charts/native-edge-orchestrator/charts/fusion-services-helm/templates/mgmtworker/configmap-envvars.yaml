apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "fusion-services.name" . }}-mgmtworker-envvars
  annotations:
    {{- include "fusion-services.merge" ( list .Values.commonAnnotations "" ) | nindent 4 }}
data:
  REST_PROTOCOL: {{ .Values.entrypoint.protocol }}
  REST_HOST: {{ .Values.entrypoint.name }}
  REST_PORT: {{ .Values.entrypoint.port | quote }}
  {{- if (.Values.composer).enabled }}
  COMPOSER_BACKEND_HOST: {{ .Values.entrypoint.name }}
  COMPOSER_BACKEND_SERVICE_PORT: {{ .Values.entrypoint.port | quote }}
  {{- end }}
  STAGE_BACKEND_HOST: {{ .Values.entrypoint.name }}
  STAGE_BACKEND_SERVICE_PORT: {{ .Values.entrypoint.port | quote }}
  {{ range $key, $value := .Values.mgmtworker.env -}}
  {{ $key }}: {{ tpl $value $ | quote }}
  {{ end -}}
