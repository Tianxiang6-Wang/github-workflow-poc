{{- if (.Values.composer).enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: composer-backend
  name: {{ template "fusion-services.name" . }}-composer-backend
  annotations:
    {{- include "fusion-services.merge" ( list .Values.commonAnnotations "" ) | nindent 4 }}
spec:
  replicas: {{ .Values.composer_backend.replicas }}
  selector:
    matchLabels:
      app: composer-backend
  template:
    metadata:
      labels:
        app: composer-backend
        fusion-name: cloudify-composer
      {{ with .Values.composer_backend.podLabels }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        {{- include "fusion-services.merge" ( list .Values.commonAnnotations .Values.composer_backend.podAnnotations ) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector: {{- include "fusion-services.nodeSelector" ( list .Values.composer_backend $ )| trim | nindent 8 }}
      tolerations: {{- include "fusion-services.tolerations" ( list .Values.composer_backend $ ) | trim | nindent 8 }}
      affinity: {{- include "fusion-services.affinity" ( list .Values.composer_backend $ ) | trim | nindent 8 }}
      containers:
        - env:
            - name: RESTSERVICE_ADDRESS
              value: {{ .Values.entrypoint.name }}
            - name: RESTSERVICE_PROTOCOL
              value: "{{ .Values.entrypoint.protocol }}://"
            - name: RESTSERVICE_PORT
              value: {{ .Values.entrypoint.port | quote }}
            {{- include "fusion-services.postgres_env_vars" (dict "root" $) | nindent 12 }}
          image: {{ include "fusion-services.image.name" (dict "svc" ( index .Values.components "fusion-manager-composer-backend" ) "repo" .Values.global.repository) }}
          imagePullPolicy: {{ default .Values.global.image.pullPolicy ( index .Values.components "fusion-manager-composer-backend" ).pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          name: composer-backend
          resources: {{- toYaml .Values.composer_backend.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.composer_backend.port }}
          volumeMounts:
            - mountPath: /etc/cloudify/ssl
              name: ssl
              readOnly: true
          {{- if .Values.composer_backend.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              port: {{ .Values.composer_backend.port}}
              path: "/composer/backend/"
            initialDelaySeconds: {{ .Values.composer_backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.composer_backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.composer_backend.probes.liveness.timeoutSeconds }}
            successThreshold: {{ .Values.composer_backend.probes.liveness.successThreshold }}
            failureThreshold: {{ .Values.composer_backend.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.composer_backend.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              port: {{ .Values.composer_backend.port}}
              path: "/composer/backend/"
            initialDelaySeconds: {{ .Values.composer_backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.composer_backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.composer_backend.probes.readiness.timeoutSeconds }}
            successThreshold: {{ .Values.composer_backend.probes.readiness.successThreshold }}
            failureThreshold: {{ .Values.composer_backend.probes.readiness.failureThreshold }}
          {{- end }}
      restartPolicy: Always
      volumes:
        - name: ssl
          secret:
            secretName: {{ template "fusion-services.name" . }}-ssl-certs
            optional: false
      {{- include "fusion-services.images.pullSecrets" . | nindent 6 }}
{{- end }}
