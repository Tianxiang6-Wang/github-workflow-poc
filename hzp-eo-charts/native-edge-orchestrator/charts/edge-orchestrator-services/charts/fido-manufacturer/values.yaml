# Global values (needs to be replicated here because a subchart can't have a dependency on its parent)
global:
  imagePullSecrets:
  - docker-secret
  fidoManufacturer:
    smoketestEnabled: false
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
  nginx_gw:
    enabled: false
components:
  hzp-fido-manufacturer:
    image: hzp-fido-manufacturer
    version: latest
    project: hzp/
  busybox:
    image: busybox
    version: 1.37.0
    project: ''
svc:
  name: &serviceName fido-manufacturer
  resources:
    limits:
      cpu: 200m
      memory: 400Mi
    requests:
      cpu: 5m
      memory: 25Mi
  podLabels:
    hzp-app: *serviceName
    hzp-role: eo-service
    hzp.iam.webhook/active: "{{ .Values.global.nginx_gw.enabled | quote }}"
  autoScaling:
    enabled: false
    labels: {}
    minReplicas: 1
    maxReplicas: 4
    metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
        - type: Pods
          value: 1
          periodSeconds: 600
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
        - type: Pods
          value: 1
          periodSeconds: 60
# Subchart values
port: 8039
image:
  name: hzp-fido-manufacturer
  pullPolicy: Always
  tag: latest
env:
- name: DB_HOST
  valueFrom:
    configMapKeyRef:
      name: create-postgres-host-configmap
      key: postgresHost
- name: DB_PORT
  valueFrom:
    configMapKeyRef:
      name: create-postgres-host-configmap
      key: postgresPort
- name: DB_NAME
  value: "est_owner_db"
- name: DB_USER
  value: est_owner_db
- name: DB_PASSWORD
  valueFrom:
    secretKeyRef:
      name: postgres-secret
      key: est_owner_db-password
- name: encrypt_password
  valueFrom:
    secretKeyRef:
      name: fido-secret
      key: encrypt-password
- name: api_password
  valueFrom:
    secretKeyRef:
      name: fido-secret
      key: api-password
- name: ssl_password
  valueFrom:
    secretKeyRef:
      name: fido-secret
      key: ssl-password
- name: DB_CONNECTION_RETRIES
  value: "3"
- name: DB_MAX_SIZE
  value: "25"
