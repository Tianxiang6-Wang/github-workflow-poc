{{- $svc := .Values.svc -}}
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/app: {{ $svc.name }}
  name: {{ $svc.name }}
spec:
  type: ClusterIP
  ports:
    - name: api-port
      port: 8080
    - name: websocket-port
      port: 8088
  selector:
    app.kubernetes.io/app: {{ $svc.name }}
