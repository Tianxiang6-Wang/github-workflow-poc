{{- $svc := .Values.svc -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.svc.name }}
  labels:
    app.kubernetes.io/app: {{ .Values.svc.name }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.svc.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/app: {{ .Values.svc.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
spec:
{{- if not .Values.svc.autoScaling.enabled }}
  replicas: {{ .Values.svc.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/app: {{ .Values.svc.name }}
  template:
    metadata:
      annotations:
        hzp.iam.webhook/authentication-enabled: "false"
        hzp.iam.webhook/authorization-enabled: "false"
{{- if .Values.global.instrumentation.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ $svc.port }}"
{{- end }}		        
      labels:
        app.kubernetes.io/app: {{ .Values.svc.name }}
{{- tpl (toYaml .Values.svc.podLabels) . | replace "'" "" | nindent 8 }}
    spec:
      {{- include "images.pullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: events-locales-0
          emptyDir: {}
        {{- include "logLevel.configMap.volume" $ | indent 8 }}
      nodeSelector: {{- include "pods.nodeSelector" ( list .Values.svc $ )| trim | nindent 8 }}
      tolerations: {{- include "pods.tolerations" ( list .Values.svc $ ) | trim | nindent 8 }}
      affinity: {{- include "pods.affinity" ( list .Values.svc $ ) | trim | nindent 8 }}
      containers:
        - image: {{ include "manifest.image.name" (dict "data" (index .Values.components .Values.svc.image.name ) "repo" .Values.global.repository) }}
          name: {{ .Values.svc.name }}
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          volumeMounts:
            - name: events-locales-0
              mountPath: /home/event_svc/locale/EventLocale
            {{- include "logLevel.configMap.mount" $ | indent 12 }}
          ports:
            - containerPort: {{ $svc.port }}
          resources:
            {{- toYaml .Values.svc.resources | nindent 12 }}
          env:
            - name: NATS_URL
              value: "nats://jetstream.{{ .Release.Namespace }}.svc.cluster.local:4222"
            - name: INVENTORY_SERVICE_URL
              value: "http://hzp-inventory-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: CATALOG_SERVICE_URL
              value: "http://hzp-catalog-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: HEALTHCHECK_SERVICE_URL
              value: "http://hzp-health-check-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: JOB_SERVICE_URL
              value: "http://hzp-job-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: UPGRADE_SVC_URL
              value: "http://hzp-upgrade-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: S3_DOWNLOAD_URL
              value: {{ tpl .Values.global.s3.downloadUrl . | quote }}
            - name: ENABLE_INSTRUMENTATION
              value: {{ .Values.global.instrumentation.enabled | quote }}
            {{- toYaml $svc.env | nindent 12 }}
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      initContainers:
        - name: init-nats
          image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: NATS_HOST
              value: "jetstream.{{ .Release.Namespace }}.svc.cluster.local"
            - name: NATS_MONITORING_PORT
              value: "8222"
            - name: waiting_for_nats_to_be_initialized
              valueFrom:
                configMapKeyRef:
                  key: waiting_for_nats_to_be_initialized
                  name: infra-status-config
              
          command:
            - sh
            - -c
            - |
              echo 'Waiting for Jetstream NATS to become ready...'
              command="wget -S ${NATS_HOST}:${NATS_MONITORING_PORT}/healthz  2>&1 | awk '/^  HTTP/{print $2}'"
              status=$(eval "$command")
              echo "status: $status"
              while [[ "$status" != *"HTTP/1.1 200 OK"* ]]; do
                  sleep 2;
                  status=$(eval "$command")
                  echo "status: $status"
              done;
              echo 'Jetstream OK ✓'
        - name: init-upgrade
          image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              echo 'Waiting for hzp-upgrade-svc to become ready...'
              
              until printf "." && nc -z -w 2 hzp-upgrade-svc 80; do
                  sleep 2;
              done;
              
              echo 'Hzp-upgrade OK ✓'
        - name: init-inventory
          image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              echo 'Waiting for hzp-inventory to become ready...'
              until printf "." && nc -z -w 2 hzp-inventory-svc 80; do
                  sleep 2;
              done;
              echo 'Hzp-inventory OK ✓'
        - image: {{ include "manifest.image.name" (dict "data" (index .Values.components .Values.svc.localization.image.name ) "repo" .Values.global.repository) }}
          name: install-events-locales-container
          imagePullPolicy: {{ $svc.localization.image.pullPolicy }}
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /translation/EventLocale
              name: events-locales-0
          command: [ '/bin/sh', '-c' ]
          args:
            - cp -r ./translation/* /translation/EventLocale;
