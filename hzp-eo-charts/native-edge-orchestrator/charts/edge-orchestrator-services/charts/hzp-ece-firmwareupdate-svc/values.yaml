# Global values (needs to be replicated here because a subchart can't have a dependency on its parent)
global:
  imagePullSecrets:
    - docker-secret
  eceFirmwareUpdateSvc:
    smoketestEnabled: false
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
  instrumentation:
    enabled: false
  s3:
    downloadUrl: http://eo-management-seaweedfs-s3.{{ .Release.Namespace }}.svc.cluster.local:8333
components:
  firmware-update-svc:
    image: firmware-update-svc
    version: latest
    project: hzp/
  busybox:
    image: busybox
    version: 1.37.0
    project: ''
  common-locales-bundle:
    image: common-locales-bundle
    version: latest
    project: hzp/
# Subchart values
svc:
  name: &serviceName hzp-ece-firmwareupdate-svc
  trigger: hzp-ece-firmwareupdate-trigger
  filters:
    - all:
      - prefix:
          type: hzp
      - not:
          exact:
            eventtype: Trace
  replicaCount: 1
  port: 8080
  image:
    name: firmware-update-svc
    pullPolicy: Always
    tag: latest
  podLabels:
    hzp-app: *serviceName
    hzp-role: eo-service
    hzp.iam.webhook/active: "{{ .Values.global.nginx_gw.enabled | quote }}"
  resources:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 5m
      memory: 25Mi
  env:
    - name: ENABLE_PLAYGROUND
      value: "true"
    - name: APP_PORT
      value: "8080"
    - name: LOG_LEVEL
      value: "debug"
    - name: DB_HOST
      valueFrom:
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresHost
    - name: DB_PORT
      valueFrom:
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresPort
    - name: DB_USER
      value: "hzp_ece_update"
    - name: DB_PA
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: hzp_ece_update-password
  localization:
    image:
      name: common-locales-bundle
      tag: latest
      pullPolicy: Always
  autoScaling:
    enabled: false
    labels: {}
    minReplicas: 1
    maxReplicas: 4
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 600
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60

test:
  # Subchart values
  enabled: false
  testsuite: test-suites/smoke.xml 
  replicaCount: 1
  image:
    name: event-smoke-test
    pullPolicy: Always
    tag: latest
  env:
  cpu: 0.25
  memory: 512Mi
  eventsvc:
    service:
      fullname: *serviceName
      port: 80
  qtest:
    regressionProjectId: 181
    regressionContainerId: 473428

