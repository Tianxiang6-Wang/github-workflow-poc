{{- $svc := .Values.svc -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.svc.name }}
  labels:
    hzp-app: {{ .Values.svc.name }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ $svc.port }}
      protocol: TCP
      name: http
  selector:
    hzp-app: {{ .Values.svc.name }}
    app.kubernetes.io/app: {{ .Values.svc.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  hzp.iam.webhook/active: "true"
spec:
{{- if not .Values.svc.autoScaling.enabled }}
  replicas: {{ .Values.svc.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      hzp-app: {{ .Values.svc.name }}
  template:
    metadata:
      annotations:
{{- with .Values.svc.podAnnotations }}
{{- tpl (toYaml .) $ | nindent 8 }}
{{- end }}
{{- if .Values.global.instrumentation.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ $svc.port }}"
{{- end }} 	
      labels:
{{- tpl (toYaml .Values.svc.podLabels) . | replace "'" "" | nindent 8 }}
    spec:
      {{- include "images.pullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector: {{- include "pods.nodeSelector" ( list .Values.svc $ )| trim | nindent 8 }}
      tolerations: {{- include "pods.tolerations" ( list .Values.svc $ ) | trim | nindent 8 }}
      affinity: {{- include "pods.affinity" ( list .Values.svc $ ) | trim | nindent 8 }}
      containers:
        - image: {{ include "manifest.image.name" (dict "data" (index .Values.components .Values.svc.image.name ) "repo" .Values.global.repository) }}
          name: {{ .Values.svc.name }}
          {{ $_ := set .Values "iamProxyEntry" "./hzp-inventory" }}
          {{ tpl (toYaml .Values.global.iamProxy.commandDecorator) . | nindent 10 }}
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          resources:
            {{- toYaml .Values.svc.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /admin/health/dependency
              port: {{ .Values.svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /admin/health/liveness
              port: {{ .Values.svc.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /admin/health/liveness
              port: {{ .Values.svc.port }}
            failureThreshold: 30
            periodSeconds: 3
          env:
            - name: SIDECAR_INJECTED
              value: "{{ .Values.global.iamProxy.sidecarEnabled }}"
            - name: NATS_URL
              value: "nats://jetstream.{{ .Release.Namespace }}.svc.cluster.local:4222"
            - name: EVENTING_TYPE
              value: {{ .Values.global.message.type | quote }}
            - name: NATS_SERVER_MONITORING_URL
              value: "http://jetstream.{{ .Release.Namespace }}.svc.cluster.local:8222"
            - name: JOB_SERVICE_URL
              value: "http://hzp-job-svc.{{ .Release.Namespace }}.svc.cluster.local/api/v1/job"
            - name: EO_INIT_SERVICE_URL
              value: "http://hzp-eo-initialization-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: OWNER_SERVICE_URL
              value: "http://fido-owner.{{ .Release.Namespace }}.svc.cluster.local"
            - name: HEALTH_CHECK_SERVICE_URL
              value: "http://hzp-health-check-svc.{{ .Release.Namespace }}.svc.cluster.local/api/v1/health-check"
            - name: DATACOLLECTION_URL
              value: "http://hzp-datacollection-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: FDO_ONBOARDING_SVC_URL
              value: "http://hzp-security-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: FIRMWARE_UPDATE_URL
              value: "http://hzp-ece-firmwareupdate-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: FUSION_SERVICE_URL
              value: "http://fusion-entrypoint.{{ .Release.Namespace }}.svc.cluster.local"
            - name: COMPUTE_SERVICE_URL
              value: "http://hzp-compute-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: SCHEDULER_SVC_URL
              value: "http://hzp-scheduler-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: FRU_CRU_SERVICE_URL
              value: "http://hzp-fru-cru-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: CERTIFICATE_SVC_URL
              value: "http://hzp-certificate-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: CATALOG_SVC_URL
              value: "http://hzp-catalog-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: UPGRADE_SVC_BASE_URL
              value: "http://hzp-upgrade-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: EO_PROXY_URL
              value: "http://hzp-eoproxy-svc.{{ .Release.Namespace }}.svc.cluster.local:8080"
            - name: OE_TEMPLATE_MGR_URL
              value: "http://hzp-oe-template-mgr-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: EO_IP
              value: {{ .Values.global.ingress.fqdn }}
            - name: EO_NAME
              value: {{ .Values.global.eoName }}
            - name: ORG_ID
              value: {{ .Values.global.dsp.portal.orgId | default "" }}
            - name: ORCH_ID
              value: {{ .Values.global.dsp.portal.orchId | default "" }}
            - name: PORTAL_NATS_URL
              {{- if .Values.global.dsp.portal.namespace }}
              value: "nats://{{ tpl .Values.global.dsp.portal.nats.url . }}:4222"
              {{- else }}
              value: ""
              {{- end}}
            - name: NATS_TIMEOUT_SECONDS
              value: "30"
            - name: DISABLE_CLUSTER_VALIDATIONS
              value: "false"
            - name: ENABLE_INSTRUMENTATION
              value: {{ .Values.global.instrumentation.enabled | quote }}
            - name: K8S_DISTRO
              value: {{ .Values.global.k8s.distro }}
            - name: DAUTH_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  key: PORTAL_URL
                  name: iam-bootstrap-config
            {{- toYaml $svc.env | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.global.podSecurityContext.runAsUser }}
            runAsGroup: {{ .Values.global.podSecurityContext.runAsGroup }}
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: events-locales-0
              mountPath: /home/event_svc/locale/EventLocale
            - name: idrac-credentials
              mountPath: /var/run/secrets/hzp/idrac-client-credentials
              readOnly: true
            - mountPath: /var/run/secrets/hzp/portal-ca-certs
              name: portal-ca-certs
              readOnly: true
            {{- include "logLevel.configMap.mount" $ | indent 12 }}
      initContainers:
      - name: init-dependencies
        image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: {{ .Values.global.podSecurityContext.runAsUser }}
          runAsGroup: {{ .Values.global.podSecurityContext.runAsGroup }}
          allowPrivilegeEscalation: false
        env:
          - name: waiting_for_postgres_to_be_initialized
            valueFrom:
              configMapKeyRef:
                key: waiting_for_postgres_to_be_initialized
                name: infra-status-config
          {{- toYaml $svc.env | nindent 10 }}
        command:
          - sh
          - -c
          - |
            echo 'Waiting for PostgreSQL to become ready...'
            until printf "." && nc -z -w 2 $DB_HOST $DB_PORT; do
                sleep 2;
            done;
            echo 'PostgreSQL OK ✓'
            echo 'Waiting for Vault to become ready...'
            until printf "." && nc -z -w 2 edgevault 8200; do
              sleep 2;
            done;
            echo 'Vault OK ✓'
            echo 'Waiting for scheduler svc to become ready...'
            until printf "." && nc -z -w 2 hzp-scheduler-svc 80; do
                sleep 2;
            done;
            echo 'scheduler svc OK ✓'
            echo 'Waiting for eo-initialization svc to become ready...'
            until printf "." && nc -z -w 2 hzp-eo-initialization-svc 80; do
                sleep 2;
            done;
            echo 'eo-initialization svc OK ✓'
      - image: {{ include "manifest.image.name" (dict "data" (index .Values.components .Values.svc.localization.image.name ) "repo" .Values.global.repository) }}
        name: install-events-locales-container
        imagePullPolicy: {{ $svc.localization.image.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          runAsUser: {{ .Values.global.podSecurityContext.runAsUser }}
          runAsGroup: {{ .Values.global.podSecurityContext.runAsGroup }}
          allowPrivilegeEscalation: false
        volumeMounts:
          - mountPath: /translation/EventLocale
            name: events-locales-0
        command: [ '/bin/sh', '-c' ]
        args:
          - cp -r ./translation/* /translation/EventLocale;
      volumes:
        - name: events-locales-0
          emptyDir: {}
        - name: idrac-credentials
          secret:
            secretName: idrac-client-credentials
            optional: true
        - name: portal-ca-certs
          secret:
            secretName: dapp-root-ca
            optional: true
        {{- include "logLevel.configMap.volume" $ | indent 8 }}
