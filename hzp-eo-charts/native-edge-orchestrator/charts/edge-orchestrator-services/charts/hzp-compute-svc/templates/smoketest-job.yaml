{{- if or (.Values.global.regressionEnabled) (.Values.global.computeSvc.smoketestEnabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: compute-smoke-test
spec:
  template:
    metadata:
      name: compute-smoke-test
      labels:
{{- tpl (toYaml .Values.test.podLabels) . | replace "'" "" | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.test.rbac.name }}
      {{- include "images.pullSecrets" . | nindent 6 }}
      nodeSelector: {{- include "pods.nodeSelector" ( list .Values.svc $ )| trim | nindent 8 }}
      tolerations: {{- include "pods.tolerations" ( list .Values.svc $ ) | trim | nindent 8 }}
      affinity: {{- include "pods.affinity" ( list .Values.svc $ ) | trim | nindent 8 }}
      containers:
        - name: compute-smoke-test-container
          env:
          - name: MESSAGING_URL
            value: "nats://jetstream.{{ .Release.Namespace }}.svc.cluster.local"
          - name: BASE_URL
            value: "http://{{ .Values.test.computesvc.service.fullname }}.{{ .Release.Namespace }}.svc.cluster.local"
          - name: CATALOG_SVC_BASE_URL
            value: "http://{{ .Values.test.catalogsvc.service.fullname }}.{{ .Release.Namespace }}.svc.cluster.local"
          - name: INVENTORY_SVC_BASE_URL
            value: "http://{{ .Values.test.inventorysvc.service.fullname }}.{{ .Release.Namespace }}.svc.cluster.local"
          - name: JOB_SVC_BASE_URL
            value: "http://{{ .Values.test.jobsvc.service.fullname }}.{{ .Release.Namespace }}.svc.cluster.local"
          - name: RP_ENDPOINT
            value: "{{ .Values.test.reportportal.rpendpoint }}"
          - name: RP_API_KEY
            value: "{{ .Values.test.reportportal.rpuuid }}"
          - name: RP_MODE
            value: default
          - name: DOCKER_CONFIG_JSON
            valueFrom:
              secretKeyRef:
                name: docker-secret
                key: .dockerconfigjson
          - name: RP_PROJECT
            value: HZP_EO_SERVICES
          - name: RP_LAUNCH
            value: "{{ .Values.test.computesvc.service.fullname }}"
          - name: RP_ATTRIBUTES
            value: "RELEASE_VERSION:{{ .Values.test.reportportal.release }};EO_IP:{{ .Values.test.reportportal.eourl }};EO_MANIFEST:{{ .Values.test.reportportal.manifest }};ECE_MANIFEST:{{ .Values.test.reportportal.ecemanifest }};TEST_GROUP:{{ .Values.test.reportportal.suite }};RP_LAUNCH_KEY_ATTRIBUTE:{{ .Values.test.reportportal.runid }};;RELEASE_VERSION:{{ .Values.test.reportportal.release }};"
          {{- toYaml .Values.test.env | nindent 10 }}
          image: {{ include "manifest.image.name" (dict "data" (index .Values.components .Values.test.image.name ) "repo" .Values.global.repository) }}
          imagePullPolicy: {{ .Values.test.image.pullPolicy }}
          command: ['/bin/sh', '-c']
  #         future enchancement: remove sleep before test, as of now dispatcher is taking time to connect to jetstream server
  #         sleep after the test is to enable pipeline to copy the test result when pod is running state
          args:
            - |
              sleep 60; echo All dependent components are running. Start testing!;
              java -jar tests.jar {{ .Values.test.testsuite }}; sleep 60;
              if wget -q --post-data='' -S -O /dev/null http://127.0.0.1:15020/quitquitquit 2>/dev/null; then
                  echo "Terminated istio-proxy."
              fi
      initContainers:
        - name: init-postgres
          image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
          imagePullPolicy: {{ .Values.test.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo 'Waiting for Hzp Inventory to become ready...'
  
              until printf "." && nc -z -w 2 {{ .Values.test.postgresql.service.fullname }} {{ .Values.test.postgresql.service.port }}; do
                  sleep 2;
              done;
  
              echo 'PostgreSQL OK ✓'
        - name: init-compute-svc
          image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
          imagePullPolicy: {{ .Values.test.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo 'Waiting for compute to become ready...'
  
              until printf "." && nc -z -w 2 {{ .Values.test.computesvc.service.fullname }} {{ .Values.test.computesvc.service.port }}; do
                  sleep 2;
              done;
  
              echo 'hzp-compute-svc OK ✓'
      restartPolicy: Never

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.test.rbac.name }}
{{- include "images.pullSecrets" . }}

---

kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.test.rbac.clusterRole }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [ "" ]
    resources: [ "pods/exec" ]
    verbs: [ "create" ]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.test.rbac.clusterRoleBinding }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.test.rbac.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.test.rbac.name }}
    namespace: {{ .Release.Namespace }}

---
{{- end }}
