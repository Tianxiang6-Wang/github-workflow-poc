# Global values (needs to be replicated here because a subchart can't have a dependency on its parent)
global:
  imagePullSecrets:
    - docker-secret
  message:
    type: nats
  ingress:
    fqdn: localhost
  computeSvc:
    smoketestEnabled: false
  clusterResourcesPrefix: ""
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
  instrumentation:
    enabled: false
components:
  compute-svc:
    image: compute-svc
    version: latest
    project: hzp/
  busybox:
    image: busybox
    version: 1.37.0
    project: ''
  compute-smoke-test:
    image: compute-smoke-test
    version: latest
# Subchart values
svc:
  rbac:
    name: compute-rbac
    clusterRole: compute-role
    clusterRoleBinding: compute-access
  name: &serviceName hzp-compute-svc
  trigger: hzp-compute-svc-trigger
  agentstart: hzp-compute-svc-agentstart-trigger
  filter: hzp.compute.svc
  replicaCount: 1
  port: 8080
  image:
    name: compute-svc
    pullPolicy: Always
    tag: latest
  podLabels:
    hzp-app: *serviceName
    hzp-role: eo-service
    hzp.iam.webhook/active: "{{ .Values.global.nginx_gw.enabled | quote }}"
  podAnnotations:
    hzp.iam.webhook/authentication-enabled: "false"
    hzp.iam.webhook/authorization-enabled: "false"
  resources:
    limits:
      cpu: 100m
      memory: 200Mi
    requests:
      cpu: 5m
      memory: 25Mi
  env:
    - name: DB_HOST
      valueFrom:
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresHost
    - name: DB_PORT
      valueFrom:
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresPort
    - name: DB_USER
      value: "hzp_compute_svc"
    - name: DB_PA
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: hzp_compute_svc-password
  autoScaling:
    enabled: false
    labels: {}
    minReplicas: 1
    maxReplicas: 4
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 600
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60
test:
  # Subchart values
  eoEceRegression: true
  testsuite: test-suites/smoke.xml
  replicaCount: 1
  podLabels:
    hzp.iam.webhook/active: "false"
    hzp-app: hzp-compute-svc-regression
    hzp-role: smoke-test
  podAnnotations:
    hzp.iam.webhook/authentication-enabled: "false"
    hzp.iam.webhook/authorization-enabled: "false"
  rbac:
    name: compute-svc-test-rbac
    clusterRole: compute-svc-smoke-test-role
    clusterRoleBinding: compute-svc-smoke-test-access
  image:
    name: compute-smoke-test
    pullPolicy: Always
    tag: latest
  env:
    - name: MESSAGING_STREAM_NAME
      value: "K-ORDERS"
    - name: DATABASE_URL
      valueFrom: 
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresUrl
    - name: DATABASE_USERNAME
      value: "test"
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: test-password
  cpu: 0.25
  memory: 512Mi
  postgresql:
    service:
      fullname: postgres
      port: 5432
  computesvc:
    service:
      fullname: *serviceName
      port: 80
  catalogsvc:
    service:
      fullname: hzp-catalog-svc
      port: 8080
  inventorysvc:
    service:
      fullname: hzp-inventory-svc
      port: 8080
  jobsvc:
    service:
      fullname: hzp-job-svc
      port: 8080
  qtest:
    regressionProjectId: 181
    regressionContainerId: 768380
  reportportal:
    rpendpoint: 100
    rpuuid: 9bgc
    eourl: 100
    manifest: 1
    ecemanifest: 1
    runid: 1
    release: 1
    suite: 1

# for updating plugin versions to latest in blueprints, deployments and nodes
pluginUpdateJob:
  name: plugin-update-job
  jobAnnotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "3"
  podLabels:
    hzp-app: delco-job
    app: migrations
    hzp.iam.webhook/active: "false"
    hzp-role: eo-service
  computeSvc:
    image:
      name: compute-svc
    port: 8080
    resources:
      limits:
        cpu: 50m
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 25Mi
    env:
      - name: DB_HOST
        valueFrom:
          configMapKeyRef:
            name: create-postgres-host-configmap
            key: postgresHost
      - name: DB_PORT
        valueFrom:
          configMapKeyRef:
            name: create-postgres-host-configmap
            key: postgresPort
      - name: DB_USER
        value: "fusion_plugins"
      - name: DB_PA
        valueFrom:
          secretKeyRef:
            name: postgres-secret
            key: fusion_plugins-password
      - name: BLUEPRINTS_USER
        value: "blueprints"
      - name: BLUEPRINTS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-secret
            key: blueprints-password
      - name: FUSION_DB_USER
        value: "fusion_db"
      - name: FUSION_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-secret
            key: fusion_db-password
