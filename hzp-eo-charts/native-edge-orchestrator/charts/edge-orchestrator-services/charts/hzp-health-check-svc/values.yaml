# Global values (needs to be replicated here because a subchart can't have a dependency on its parent)
global:
  imagePullSecrets:
    - docker-secret
  message:
    type: nats
  healthCheckSvc:
    smoketestEnabled: false
  clusterResourcesPrefix: ""
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
  fido:
    global_rv_flag: "disabled"
  instrumentation:
    enabled: false
components:
  health-check-svc:
    image: health-check-svc
    version: latest
    project: hzp/
  busybox:
    image: busybox
    version: 1.37.0
    project: ''
  health-check-smoke-test:
    image: health-check-smoke-test
    version: latest
    project: hzp/
# Subchart values
svc:
  rbac:
    name: healthcheck-rbac
    clusterRole: healthcheck-role
    clusterRoleBinding: healthcheck-access
  name: &serviceName hzp-health-check-svc
  replicaCount: 1
  port: 8080
  image:
    name: health-check-svc
    pullPolicy: Always
    tag: latest
  podLabels:
    hzp-app: *serviceName
    hzp-role: eo-service
    hzp.iam.webhook/active: "{{ .Values.global.nginx_gw.enabled | quote }}"
  resources:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 5m
      memory: 25Mi
  env:
    - name: ENABLE_PLAYGROUND
      value: "true"
    - name: APP_PORT
      value: "8080"
    - name: HC_SIGN_PATH
      value: "./config"
    - name: HC_SIGN_PATH2
      value: "./config"
    - name: DB_HOST
      valueFrom:
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresHost
    - name: DB_PORT
      valueFrom: 
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresPort
    - name: DB_USER
      value: "hzp_healthcheck"
    - name: DB_PA
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: hzp_healthcheck-password
  autoScaling:
    enabled: false
    labels: {}
    minReplicas: 1
    maxReplicas: 4
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 600
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60

test:
  # Subchart values
  podLabels:
    hzp.iam.webhook/active: "false"
    hzp-app: hzp-health-check-svc-regression
    hzp-role: smoke-test
  eoEceRegression: true
  testsuite: test-suites/smoke.xml
  replicaCount: 1
  rbac:
    name: health-check-svc-test-rbac
    clusterRole: health-check-svc-smoke-test-role
    clusterRoleBinding: health-check-svc-smoke-test-access
  image:
    name: health-check-smoke-test
    pullPolicy: Always
    tag: latest
  env:
    - name: MESSAGING_STREAM_NAME
      value: "K-ORDERS"
    - name: DATABASE_URL
      valueFrom: 
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresUrl
    - name: DATABASE_USERNAME
      value: "test"
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: test-password
  cpu: 0.25
  memory: 512Mi
  postgresql:
    service:
      fullname: postgres
      port: 5432
  healthchecksvc:
    service:
      fullname: *serviceName
      port: 80
  upgradesvc:
    service:
      fullname: hzp-upgrade-svc
      port: 80
  qtest:
    regressionProjectId: 181
    regressionContainerId: 586384
  reportportal:
    rpendpoint: 100
    rpuuid: 9bgc
    eourl: 100
    manifest: 1
    ecemanifest: 1
    runid: 1
    release: 1
    suite: 1

