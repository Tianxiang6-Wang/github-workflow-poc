# Global values (needs to be replicated here because a subchart can't have a dependency on its parent)
global:
  imagePullSecrets:
    - docker-secret
  ingress:
    fqdn: localhost
  s3:
    url: http://eo-management-seaweedfs-s3.{{ .Release.Namespace }}.svc.cluster.local:8333
    region: us-east-1
    bucketPrefix: ""
    serviceAccountAnnotations: {}  # Required to link service account to AWS role.
    credentials:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: eo-management-seaweedfs-s3-secret
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: eo-management-seaweedfs-s3-secret
            key: AWS_SECRET_ACCESS_KEY
  dataCollectionSvc:
    smoketestEnabled: false
  clusterResourcesPrefix: ""
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
  instrumentation:
    enabled: false
  ova:
    enabled: false
components:
  datacollection-svc:
    image: datacollection-svc
    version: latest
    project: hzp/
  busybox:
    image: busybox
    version: 1.37.0
    project: ''
  datacollection-smoke-test:
    image: datacollection-smoke-test
    version: latest
    project: hzp/
# Subchart values
svc:
  name: &serviceName hzp-datacollection-svc
  replicaCount: 1
  port: 8080
  image:
    name: datacollection-svc
    pullPolicy: Always
    tag: latest
  podLabels:
    hzp-app: *serviceName
    hzp-role: eo-service
    hzp.iam.webhook/active: 'true'
  resources:
    limits:
      cpu: 100m
      memory: 300Mi
    requests:
      cpu: 5m
      memory: 25Mi
  env:
    - name: ENABLE_PLAYGROUND
      value: "true"
    - name: APP_PORT
      value: "8080"
    - name: DB_HOST
      valueFrom:
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresHost
    - name: DB_PORT
      valueFrom: 
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresPort
    - name: DB_USER
      value: "datacollection"
    - name: DB_PA 
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: datacollection-password
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: datacollection-password
    - name: LOG_ROTATION_INTERVAL_IN_SECONDS
      value: "600"
  pvc:
    ese:
      name: hzp-shared-pvc
      mountPath: /data
  autoScaling:
    enabled: false
    labels: {}
    minReplicas: 1
    maxReplicas: 4
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 600
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: hzp-app
                operator: In
                values:
                  - hzp-product-svc
          topologyKey: "kubernetes.io/hostname"
  postgresql:
    service:
      fullname: postgres
      port: 5432
  service:
    fullname: *serviceName
    port: 80
job:
  logsMigrationEnabled: true
test:
  # Subchart values
  podLabels:
    hzp.iam.webhook/active: "false"
    hzp-app: hzp-dc-regression
    hzp-role: smoke-test
  testsuite: test-suites/smoke.xml 
  replicaCount: 1
  image:
    name: datacollection-smoke-test
    pullPolicy: Always
    tag: latest
  env:
    - name: MESSAGING_URL
      value: "nats://jetstream.hzp.svc.cluster.local"
    - name: MESSAGING_STREAM_NAME
      value: "K-ORDERS"
    - name: DATABASE_URL
      valueFrom: 
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresUrl
    - name: DATABASE_USERNAME
      value: "datacollection"
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: datacollection-password
  cpu: 0.25
  memory: 512Mi
  postgresql:
    service:
      fullname: postgres
      port: 5432
  service:
    fullname: *serviceName
    port: 80
  rbac:
    namePrefix: dc-smoke-test
  qtest:
    regressionProjectId: 181
    regressionContainerId: 608075
  reportportal:
    rpendpoint: 100
    rpuuid: 9bgc
    eourl: 100
    manifest: 1
    runid: 1
    release: 1
    suite: 1
