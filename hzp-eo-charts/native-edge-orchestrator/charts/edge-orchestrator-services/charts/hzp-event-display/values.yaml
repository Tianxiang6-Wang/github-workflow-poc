# Global values (needs to be replicated here because a subchart can't have a dependency on its parent)
global:
  imagePullSecrets:
    - docker-secret
  eventDisplay:
    smoketestEnabled: false
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
components:
  hzp-event-display:
    image: hzp-event-display
    version: latest
    project: hzp/
  busybox:
    image: busybox
    version: 1.37.0
    project: ''
# Subchart values
svc:
  name: &serviceName hzp-event-display
  trigger: hzp-event-display-trigger
  project: developers/
  port: 8080
  image:
    name: hzp-event-display
    pullPolicy: Always
    tag: v1
  podLabels:
    hzp-app: *serviceName
    hzp-role: smoke-test
  resources:
    limits:
      cpu: 100m
      memory: 200Mi
    requests:
      cpu: 50m
      memory: 25Mi
  env:
    - name: BODY
      value: "false" # set to "true" to print the body of the event 
    - name: PERSIST_EVENTS
      value: "true" # set to "true" to persist events to postgres  
    - name: DB_HOST
      valueFrom:
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresHost
    - name: DB_PORT
      valueFrom: 
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresPort
    - name: DB_USER
      value: "test"
    - name: DB_PA
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: test-password
    - name: QUEUE_GROUP
      value: hzp-event-display-queue
  autoScaling:
    enabled: false
    labels: {}
    minReplicas: 1
    maxReplicas: 4
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 600
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60
