apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.svc.rbac.namePrefix }}-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.svc.rbac.namePrefix }}-hzp-role
rules:
{{- if not .Values.global.nginx_gw.enabled }}
  - apiGroups: [ "networking.istio.io" ]
    resources: [ "gateways" ]
    verbs: [ "get", "list", "watch" ]
{{- else }}
  - apiGroups: [ "", "apps" ]
    resources: [ "configmaps", "pods" ]
    verbs: [ "get", "list", "update" ]
  - apiGroups: [ "" ]
    resources: [ "pods/exec" ]
    verbs: [ "create" ]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.svc.rbac.namePrefix }}-hzp-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.svc.rbac.namePrefix }}-hzp-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.svc.rbac.namePrefix }}-sa
    namespace: {{ .Release.Namespace }}
{{- if not .Values.global.nginx_gw.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.svc.rbac.namePrefix }}-istio-system-role
  namespace: istio-system
rules:
  - apiGroups: [ "security.istio.io" ]
    resources: [ "authorizationpolicies" ]
    verbs: [ "*" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.svc.rbac.namePrefix }}-istio-system-rolebinding
  namespace: istio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.svc.rbac.namePrefix }}-istio-system-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.svc.rbac.namePrefix }}-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
