# Global values (needs to be replicated here because a subchart can't have a dependency on its parent)
global:
  imagePullSecrets:
    - docker-secret
  vault:
    host: "http://edgevault.{{ .Release.Namespace }}.svc.cluster.local"
    port: &vaultPort "8200"
  keycloak:
    scheme: http
    host: keycloak-http
    port: "80"
  ingress:
    fqdn: localhost
  eoName: "NativeEdge Orchestrator"
  iamSessionSvc:
    smoketestEnabled: false
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
  instrumentation:
    enabled: false
components:
  iam-session-svc:
    image: iam-session-svc
    version: latest
    project: hzp/
  busybox:
    image: busybox
    version: 1.37.0
    project: ''
# Subchart values
svc:
  name: &serviceName hzp-iam-session-svc
  publicKeysProvider: http://localhost:8080
  port: 8080
  replicaCount: 1
  image:
    name: iam-session-svc
    pullPolicy: Always
    tag: latest
  resources:
    limits:
      cpu: 100m
      memory: 200Mi
    requests:
      cpu: 50m
      memory: 25Mi
  podAnnotations:
    hzp.iam.webhook/authn-public-keys-path: '{{ .Values.svc.publicKeysProvider }}'
    hzp.iam.webhook/authentication-enabled: "true"
    hzp.iam.webhook/authorization-enabled: "true"
    hzp.iam.webhook/resources-limits-memory: 500Mi
  podLabels:
    hzp-app: *serviceName
    hzp-role: eo-service
    hzp.iam.webhook/active: "true"
    hzp.iam.webhook/bootstrap: 'true'
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  env:
    - name: APP_PORT
      value: "8080"
    - name: DB_HOST
      valueFrom:
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresHost
    - name: DB_PORT
      valueFrom: 
        configMapKeyRef:
          name: create-postgres-host-configmap
          key: postgresPort
    - name: DB_USER
      value: "hzp_iam_session_svc"
    - name: DB_PA
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: hzp_iam_session_svc-password
    - name: KEYCLOAK_CLIENT_NAME
      valueFrom:
        secretKeyRef:
          name: keycloak-secret
          key: iam-client-name
    - name: KEYCLOAK_CLIENT_PWD
      valueFrom:
        secretKeyRef:
          name: keycloak-secret
          key: iam-client-pwd
    - name: ORG_ID
      value: "hzp"
    - name: ORG_NAME
      valueFrom:
        secretKeyRef:
          name: mist-org-secret
          key: org-name
    - name: VAULT_PORT
      value: *vaultPort
    - name: APPROLE_ID
      valueFrom:
        secretKeyRef:
          name: hzp-iam-session-svc-vault-secret
          key: role-id
          optional: false
    - name: APPROLE_SECRET_ID
      valueFrom:
        secretKeyRef:
          name: hzp-iam-session-svc-vault-secret
          key: secret-id
          optional: false
    - name: APPROLE_ID_PATH
      value: eo-approle
    - name: KV_ENGINE_PATH
      value: "kv/eo/hzp-iam-session-svc"
    - name: AUTH_CLIENT_ID
      value: "hzp-iam-session-svc"
    - name: VAULT_CERTS_KV_MOUNT_POINT
      value: "kv/m2m/hzp-iam-session-svc"
autoscaling:
  # The minimum and maximum number of replicas for the Deployment
  minReplicas: 1
  maxReplicas: 5
  # The metrics to use for scaling
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  # The scaling policy to use. This will scale up quickly but only scale down a single Pod per 5 minutes.
  # This is important because caches are usually only replicated to 2 Pods and if one of those Pods is terminated this will give the cluster time to recover.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300

dbchecker:
  image:
    # Docker image used to check Postgresql readiness at startup
    repository: busybox
    # Image tag for the dbchecker image
    tag: 1.37.0
    # Image pull policy for the dbchecker image
    pullPolicy: IfNotPresent
  # SecurityContext for the dbchecker container
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
  # Resource requests and limits for the dbchecker container
  resources:
    requests:
      cpu: "20m"
      memory: "32Mi"
    limits:
      cpu: "20m"
      memory: "32Mi"

database:
  existingSecret: postgres-secret
  hostname: postgres
  port: 5432
