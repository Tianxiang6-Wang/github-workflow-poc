{{- $svc := .Values.svc -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.svc.name }}
  labels:
    hzp-app: {{ .Values.svc.name }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.svc.port }}
      protocol: TCP
      name: http
  selector:
    hzp-app: {{ .Values.svc.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
spec:
{{- if not .Values.svc.autoScaling.enabled }}
  replicas: {{ .Values.svc.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      hzp-app: {{ .Values.svc.name }}
  template:
    metadata:
      annotations:      
{{- with .Values.svc.podAnnotations }}
{{- tpl (toYaml .) $ | nindent 8 }}
{{- end }}
{{- if .Values.global.instrumentation.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ .Values.svc.port }}"
{{- end }}
      labels:
{{- tpl (toYaml .Values.svc.podLabels) . | replace "'" "" | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.svc.rbac.namePrefix }}-sa
      {{- include "images.pullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector: {{- include "pods.nodeSelector" ( list .Values.svc $ )| trim | nindent 8 }}
      tolerations: {{- include "pods.tolerations" ( list .Values.svc $ ) | trim | nindent 8 }}
      affinity: {{- include "pods.affinity" ( list .Values.svc $ ) | trim | nindent 8 }}
      containers:
        - image: {{ include "manifest.image.name" (dict "data" (index .Values.components .Values.svc.image.name ) "repo" .Values.global.repository) }}
          {{ $_ := set .Values "iamProxyEntry" "./main" }}
          {{tpl (toYaml .Values.global.iamProxy.commandDecorator) . | nindent 10 }}
          name: {{ .Values.svc.name }}
          imagePullPolicy: {{ .Values.svc.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.svc.port }}
          resources:
            {{- toYaml .Values.svc.resources | nindent 12 }}
          env:
            - name: SIDECAR_INJECTED
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hzp.iam.webhook']
            - name: NATS_SERVER_MONITORING_URL
              value: "http://jetstream.{{ .Release.Namespace }}.svc.cluster.local:8222/varz"
            - name: NATS_URL
              value: "nats://jetstream.{{ .Release.Namespace }}.svc.cluster.local:4222"
            - name: VAULT_HOST
              value: "{{ tpl .Values.global.vault.host . }}"
            - name: VAULT_PORT
              value: "{{ .Values.global.vault.port }}"
            - name: FQDN
              value: {{ .Values.global.ingress.fqdn }}
            - name: EVENTING_TYPE
              value: {{ .Values.global.message.type | quote }}
            - name: EO_IP
              value: {{ .Values.global.ingress.fqdn }}
            - name: EO_NAME
              value: {{ .Values.global.eoName }}
            - name: MTLS_HOST
              value: {{ template "GetMTLSHost" (dict "namespace" .Release.Namespace "prefix" $.Values.global.istio.defaultPrefix.mTLSHost "default" $.Values.global.istio.mTLSHost "fqdn" $.Values.global.ingress.fqdn) }}
            - name: MTLS_RECOVERY_HOST
              value: {{ template "GetMTLSHost" (dict "namespace" .Release.Namespace "prefix" $.Values.global.istio.defaultPrefix.mTLSHostRecovery "default" $.Values.global.istio.mTLSHostRecovery "fqdn" $.Values.global.ingress.fqdn) }}
            - name: FUSION_SVC_INTERNAL_URL
            {{- if and $.Values.global.istio.deploy $.Values.global.istio.ingressgateway.internal }}
              value: "http://internal-ingress-gateway.istio-system.svc.cluster.local/fusion"
            {{- else if $.Values.global.nginx_gw.enabled }}
              value: "http://nginx-gw.{{ .Release.Namespace }}.svc.cluster.local/fusion"
            - name: TLS_CRED_NAMESPACE
              value: "{{ .Release.Namespace }}"
            {{- else }}
              {{- fail ".Values.global.istio.deploy or .Values.global.nginx_gw.enabled should be true" }}
            {{- end }}
            - name: ENABLE_INSTRUMENTATION
              value: {{ .Values.global.instrumentation.enabled | quote }}
          {{- toYaml .Values.svc.env | nindent 12 }}
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            {{- include "logLevel.configMap.mount" $ | indent 12 }}
      initContainers:
      - image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
        imagePullPolicy: Always
        name: init-vault
        securityContext:
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        command:
          - sh
          - -c
          - |
            echo 'Waiting for Vault to become ready...'
            until printf "." && nc -z -w 2 edgevault 8200; do
              sleep 2;
            done;
            echo 'Vault OK ✓'
      - image: {{ include "manifest.image.name" (dict "data" (index .Values.components "kubectl" ) "repo" .Values.global.repository) }}
        name: init-vault-bootstrap-job
        imagePullPolicy: Always
        securityContext:
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        command:
          - sh
          - -c
          - |
            echo 'Waiting for Vault bootstrap job to complete...'
            until kubectl get jobs -n {{ .Release.Namespace }} vault-bootstrap -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' | grep True ; do sleep 5 ; done
            echo 'Vault bootstrap OK ✓'
      - name: init-postgres
        image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
        imagePullPolicy: Always
        securityContext:
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: waiting_for_postgres_to_be_initialized
            valueFrom:
              configMapKeyRef:
                key: waiting_for_postgres_to_be_initialized
                name: infra-status-config
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: create-postgres-host-configmap
                key: postgresHost
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: create-postgres-host-configmap
                key: postgresPort
        command:
          - sh
          - -c
          - |
            echo 'Waiting for PostgreSQL to become ready...'
            until printf "." && nc -z -w 2 $DB_HOST $DB_PORT; do
                sleep 2;
            done;
            echo 'PostgreSQL OK ✓'
      volumes:
        {{- include "logLevel.configMap.volume" $ | indent 8 }}
