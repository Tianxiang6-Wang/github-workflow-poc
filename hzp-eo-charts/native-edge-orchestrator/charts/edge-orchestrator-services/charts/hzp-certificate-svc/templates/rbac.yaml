{{- $kindRole := "ClusterRole" }}
{{- $kindRoleBinding := "ClusterRoleBinding" }}
{{- if .Values.global.nginx_gw.enabled }}
{{- $kindRole = "Role" }}
{{- $kindRoleBinding = "RoleBinding" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.svc.rbac.namePrefix }}-sa

---

apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kindRole }}
metadata:
  name: "{{ tpl .Values.global.clusterResourcesPrefix . }}{{ .Values.svc.rbac.namePrefix }}-role"
  labels:
    env: "{{ .Release.Namespace }}"
    name: "{{ .Values.svc.rbac.namePrefix }}-role"
    globalName: "{{ tpl .Values.global.clusterResourcesPrefix . }}{{ .Values.svc.rbac.namePrefix }}-role"
rules:
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    resourceNames: [ "tls-credential", "mtls-credential", "mtls-credential-recovery" ]
    verbs: [ "get","update","watch" ]
  - apiGroups: [ "batch" ]
    resources: [ "jobs" ]
    resourceNames: [ "vault-bootstrap" ]
    verbs: [ "list","get","watch" ]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kindRoleBinding }}
metadata:
  name: "{{ tpl .Values.global.clusterResourcesPrefix . }}{{ .Values.svc.rbac.namePrefix }}-rolebinding"
  labels:
    env: "{{ .Release.Namespace }}"
    name: "{{ .Values.svc.rbac.namePrefix }}-rolebinding"
    globalName: "{{ tpl .Values.global.clusterResourcesPrefix . }}{{ .Values.svc.rbac.namePrefix }}-rolebinding"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kindRole }}
  name: "{{ tpl .Values.global.clusterResourcesPrefix . }}{{ .Values.svc.rbac.namePrefix }}-role"
subjects:
  - kind: ServiceAccount
    name: {{ .Values.svc.rbac.namePrefix }}-sa
    namespace: {{ .Release.Namespace }}
