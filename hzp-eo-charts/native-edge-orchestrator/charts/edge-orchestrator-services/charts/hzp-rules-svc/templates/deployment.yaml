{{- $svc := .Values.svc -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  labels:
    hzp-app: {{ $svc.name }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ $svc.port }}
      protocol: TCP
      name: http
  selector:
    hzp-app: {{ $svc.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
spec:
{{- if not .Values.svc.autoScaling.enabled }}
  replicas: {{ .Values.svc.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      hzp-app: {{ $svc.name }}
  template:
    metadata:
      annotations:
{{- if .Values.global.instrumentation.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ .Values.svc.port }}"
{{- end }}      
      labels:
{{- tpl (toYaml .Values.svc.podLabels) . | replace "'" "" | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      {{- include "images.pullSecrets" . | nindent 6 }}
      nodeSelector: {{- include "pods.nodeSelector" ( list .Values.svc $ )| trim | nindent 8 }}
      tolerations: {{- include "pods.tolerations" ( list .Values.svc $ ) | trim | nindent 8 }}
      affinity: {{- include "pods.affinity" ( list .Values.svc $ ) | trim | nindent 8 }}
      containers:
        - image: {{ include "manifest.image.name" (dict "data" (index .Values.components .Values.svc.image.name ) "repo" .Values.global.repository) }}
          name: {{ $svc.name }}
          {{ $_ := set .Values "iamProxyEntry" "./main" }}
          {{ tpl (toYaml .Values.global.iamProxy.commandDecorator) . | nindent 10 }}
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          resources:
            {{- toYaml .Values.svc.resources | nindent 12 }}
          env:
            - name: SIDECAR_INJECTED
              value: "{{ .Values.global.iamProxy.sidecarEnabled }}"
            - name: NATS_SERVER_MONITORING_URL
              value: "http://jetstream.{{ .Release.Namespace }}.svc.cluster.local:8222/healthz"
            - name: NATS_URL
              value: "nats://jetstream.{{ .Release.Namespace }}.svc.cluster.local:4222"
            - name: SMTP_SERVER_URL
              value: "http://hzp-notification-svc.{{ .Release.Namespace }}.svc.cluster.local/api/v2/notifications/send-email"
            - name: EVENTS_SERVER
              value: "http://hzp-events-svc.{{ .Release.Namespace }}.svc.cluster.local/"
            - name: SCHEDULER_SERVER
              value: "http://hzp-scheduler-svc.{{ .Release.Namespace }}.svc.cluster.local/"
            - name: SECRET_SERVER
              value: "http://fusion-entrypoint.{{ .Release.Namespace }}.svc.cluster.local/"
            - name: CERTIFICATE_SERVER
              value: "http://hzp-certificate-svc.{{ .Release.Namespace }}.svc.cluster.local/"
            - name: FQDN
              value: {{ .Values.global.ingress.fqdn }}
            - name: TAGS_SVC_URL
              value: "http://hzp-tags-svc.{{ .Release.Namespace }}.svc.cluster.local"
            - name: EO_NAME
              value: {{ .Values.global.eoName }}
            - name: APPROLE_ID
              valueFrom:
                secretKeyRef:
                  name: hzp-rules-svc-vault-secret
                  key: role-id
                  optional: false
            - name: APPROLE_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: hzp-rules-svc-vault-secret
                  key: secret-id
                  optional: false
            - name: APPROLE_ID_PATH
              value: "eo-approle"
            - name: AUTH_CLIENT_ID
              value: "hzp-rules-svc"
            - name: VAULT_CERTS_KV_MOUNT_POINT
              value: "kv/m2m/hzp-rules-svc"
            - name: PRODUCT_NAME
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: PRODUCT_NAME
            - name: ENABLE_INSTRUMENTATION
              value: {{ .Values.global.instrumentation.enabled | quote }}
          {{- toYaml .Values.svc.env | nindent 12 }}
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            {{- include "logLevel.configMap.mount" $ | indent 12 }}
      initContainers:
      - name: init-postgres
        image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
        imagePullPolicy: Always
        securityContext:
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: waiting_for_postgres_to_be_initialized
            valueFrom:
              configMapKeyRef:
                key: waiting_for_postgres_to_be_initialized
                name: infra-status-config
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: create-postgres-host-configmap
                key: postgresHost
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: create-postgres-host-configmap
                key: postgresPort
        command:
          - sh
          - -c
          - |
            echo 'Waiting for PostgreSQL to become ready...'
            until printf "." && nc -z -w 2 $DB_HOST $DB_PORT; do
                sleep 2;
            done;
            echo 'PostgreSQL OK ✓'
      volumes:
        {{- include "logLevel.configMap.volume" $ | indent 8 }}
