{{- $namespace := .Release.Namespace -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rbac.namePrefix }}-sa
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.rbac.namePrefix }}-binding
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rbac.namePrefix }}-sa
    namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.rbac.namePrefix }}-role
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.rbac.namePrefix }}-role
rules:
  - apiGroups: [""] # Empty string for kubernetes system
    resources: [configmaps]
    resourceNames: [{{ .Values.rbac.cmName }}]
    verbs: [{{ .Values.rbac.perm }}]
  - apiGroups: ["hzp.dell.com"]
    resources: ["edgeorchestrators"]
    verbs: [{{ .Values.rbac.crPerm }}]
