{{- if $.Values.networkPoliciesEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mockserver-network-policy
  namespace: {{ .Release.Namespace }}
spec:
  egress:
  - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 0.0.0.0/0
  ingress:
  - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - ipBlock:
            cidr: 0.0.0.0/0
  podSelector:
    matchLabels:
      hzp-app: mockserver
  policyTypes:
  - Egress
  - Ingress
{{- end -}}
