        - hzp-role: eo-service
        - hzp-app: hzp-inventory-svc
        - hzp-app: hzp-flag-manager-svc
    - service: hzp-health-check-svc
      nats: bidirectional
      k8sEndpoint: bidirectional
      ports:
        - 8080
        - 15090
      inboundRequests:
        - hzp-app: hzp-upgrade-svc
        - hzp-app: hzp-ece-firmwareupdate-svc
        - hzp-app: hzp-health-check-svc
        - hzp-app: postgresql
        - hzp-app: hzp-api-gateway-svc
      outboundRequests:
