global:
  postgresql:
    deploy: true
  vault:
    deploy: true
  keycloak:
    deploy: true
  fusionChartName: &fusionChartName fusion-services-helm
  ingress:
    enableNetworkPolicies: true
    enableNetworkPoliciesControlAtPorts: false
    
networkPolicies:
  kubeEndpointsCidrs: []  # List of IP addresses for kubernetes.default.svc.cluster.local. If empty will be resolved automatically
  infra:
    - service: istio-system
      namespace: istio-system
      permissions:
        - istio-system
        - kube-system
    - service: nats
      podSelector:
        matchLabels:
          app: nats-jetstream
      namespace: release-namespace
      permissions:
        - istio-system
        - kube-system
    - service: nats-metrics
      podSelector:
        matchLabels:
          app: nats-jetstream-metrics
      namespace: release-namespace
      permissions:
        - istio-system
        - kube-system
    - service: init-check
      namespace: release-namespace
      permissions:
        - istio-system
        - kube-system
  iam:
    - service: eo-service
      outboundRequests:
        - hzp-app: hzp-iam-policy-svc
        - hzp-app: hzp-iam-session-svc
        - hzp-app: eo-vault
    - service: fusion-service
      outboundRequests:
        - hzp-app: hzp-iam-policy-svc
        - hzp-app: hzp-iam-session-svc
        - hzp-app: eo-vault
    - service: mist-service
      outboundRequests:
        - hzp-app: hzp-iam-policy-svc
        - hzp-app: hzp-iam-session-svc
        - hzp-app: eo-vault
  apps:
    - service: keycloak-migration
      outboundRequests:
        - hzp-app: postgresql
        - hzp-app: seaweed
    - service: keycloak-mngmnt
      k8sEndpoint: bidirectional
      inboundRequests:
        - hzp-app: keycloak
      outboundRequests:
        - hzp-app: keycloak
    - service: postgresql-upgrade
      k8sEndpoint: bidirectional
      inboundRequests:
        - hzp-app: postgresql
      outboundRequests:
        - hzp-app: postgresql
    - service: hzp-delco-svc
      k8sEndpoint: bidirectional
      ports:
        - 8080
        - 15090
      inboundRequests:
        - hzp-app: hzp-upgrade-svc
        - hzp-app: delco-job
        - hzp-app: hzp-delco-svc
      outboundRequests:
        - hzp-app: hzp-upgrade-svc
        - hzp-app: istiod
        - hzp-app: hzp-delco-svc
    - service: nginx-gw
      podSelector:
        matchLabels:
          app: nginx-gw
      k8sEndpoint: bidirectional
      externalInternetTraffic: bidirectional
      ports:
        - 8080
        - 15090
      inboundRequests:
        - hzp-role: eo-service
        - hzp-role: eo-gateway
        - hzp-role: mist-service
        - hzp-role: fusion-service
        - hzp-role: nats
      outboundRequests:
        - hzp-role: eo-service
        - hzp-role: eo-gateway
        - hzp-role: mist-service
        - hzp-role: fusion-service
        - hzp-role: nats
    - service: hzp-upgrade-svc
      podSelector:
        matchLabels:
          app.kubernetes.io/app: hzp-upgrade-svc
      nats: bidirectional
      k8sEndpoint: bidirectional
      ports:
        - 8080
        - 15090
      inboundRequests:
        - hzp-app: hzp-delco-svc
        - hzp-app: hzp-health-check-svc
        - hzp-app: hzp-upgrade-svc
        - hzp-role: mist-service
        - hzp-app: postgresql
        - hzp-app: hzp-catalog-svc
        - hzp-app: eo-vault
        - hzp-app: hzp-inventory-svc
        - hzp-app: hzp-api-gateway-svc
        - hzp-app: hzp-ece-firmwareupdate-svc
        - hzp-app: hzp-oe-template-mgr-svc
      outboundRequests:
        - hzp-app: hzp-delco-svc
        - hzp-app: hzp-health-check-svc
        - hzp-app: hzp-upgrade-svc
        - hzp-role: mist-service
        - hzp-app: postgresql
        - hzp-app: hzp-catalog-svc
        - hzp-app: istiod
        - hzp-app: eo-vault
        - hzp-app: hzp-inventory-svc
        - hzp-app: hzp-ece-firmwareupdate-svc
        - hzp-app: hzp-job-svc
        - hzp-app: fido-onboarding-svc
        - hzp-app: seaweed
        - hzp-app: hzp-flag-manager-svc
    - service: postgresql
      podSelector:
        matchLabels:
          app.kubernetes.io/component: primary
          app.kubernetes.io/instance: eo-management
          app.kubernetes.io/name: postgresql
      ports:
        - 5432
      inboundRequests:
        - hzp-role: eo-service
        - hzp-role: fusion-service
      outboundRequests:
        - hzp-role: eo-service
        - hzp-app: istiod
        - hzp-role: fusion-service
        - hzp-app: hzp-flag-manager-svc
    - service: fusion-db-create-job
      inboundRequests:
        - hzp-app: fusion-db-create-job
      outboundRequests:
        - hzp-app: postgresql
    - service: hzp-catalog-svc
      podSelector:
        matchLabels:
          app.kubernetes.io/app: hzp-catalog-svc
      nats: bidirectional
      externalInternetTraffic: outbound
      ports:
        - 8080
        - 15090
      inboundRequests:
        - hzp-app: hzp-upgrade-svc
        - hzp-app: hzp-catalog-svc
        - hzp-app: hzp-oe-template-mgr-svc
        - hzp-app: hzp-ece-firmwareupdate-svc
        - hzp-app: hzp-ece-factory-os
        - hzp-app: hzp-fru-cru-svc
        - hzp-role: mist-service
        - hzp-app: postgresql
        - hzp-role: eo-service
        - hzp-app: hzp-compute-svc
        - hzp-app: hzp-health-check-svc
        - hzp-app: eo-vault
        - hzp-app: mgmt-worker
        - hzp-app: fusion-plugins-service
      outboundRequests:
        - hzp-app: hzp-upgrade-svc
        - hzp-app: hzp-catalog-svc
        - hzp-app: hzp-oe-template-mgr-svc
        - hzp-app: hzp-ece-firmwareupdate-svc
        - hzp-app: hzp-ece-factory-os
        - hzp-app: hzp-fru-cru-svc
        - hzp-role: mist-service
        - hzp-app: postgresql
        - hzp-role: eo-service
        - hzp-app: istiod
        - hzp-app: seaweed
        - hzp-app: hzp-job-svc
        - hzp-app: eo-vault
        - hzp-app: hzp-scheduler-svc
        - hzp-app: hzp-compute-svc
        - hzp-app: hzp-flag-manager-svc
        - hzp-app: container-registry
    - service: factoryos-jobs
      podSelector:
        matchLabels:
          hzp-app: hzp-catalog-svc
      outboundRequests:
        - app.kubernetes.io/app: hzp-catalog-svc
    - service: container-registry
      ports:
        - 5000
      inboundRequests:
        - hzp-app: container-registry
        - hzp-app: hzp-catalog-svc
      outboundRequests:
        - hzp-app: container-registry
        - hzp-app: istiod
        - hzp-app: hzp-flag-manager-svc
    - service: hzp-compute-svc
      nats: bidirectional
      externalInternetTraffic: outbound
      ports:
        - 8080
        - 15090
      inboundRequests:
        - hzp-app: hzp-upgrade-svc
        - hzp-app: hzp-inventory-svc
        - hzp-app: hzp-catalog-svc
      outboundRequests:
        - hzp-app: postgresql
        - hzp-role: eo-service
        - hzp-app: hzp-inventory-svc
        - hzp-app: hzp-job-svc
        - hzp-app: hzp-catalog-svc
        - hzp-app: hzp-flag-manager-svc
    - service: hzp-metrics-svc
