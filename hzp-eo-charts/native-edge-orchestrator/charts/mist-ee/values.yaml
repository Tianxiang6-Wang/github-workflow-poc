global:
  # -- Specify nodeSelector for pods which will be applied to all pods (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector).
  # Can be also overriden for each microservice.
  nodeSelector: {}
  # -- Specify tolerations for pods  which will be applied to all pods (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/)
  # Can be also overriden for each microservice.
  tolerations: []
  # -- Specify podSecurityContext for pods
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
  imagePullSecrets:
  - isgedge-registry
  dsp:
    portal:
      url: 'https://localhost'
    enabled: false

components:
  gocky-svc:
    image: gocky-svc
    version: latest
    project: hzp/
  busybox:
    image: busybox
    version: 1.37.0
    project: ''
  portal:
    image: portal
    version: latest
    project: hzp/
  mist-vminsert:
    image: mist-vminsert
    version: latest
    project: hzp/
  mist-vmselect:
    image: mist-vmselect
    version: latest
    project: hzp/
  mist-vmstorage:
    image: mist-vmstorage
    version: latest
    project: hzp/

# Used to label kubernetes resources. This should only differ between different
# product/brandings. It shouldn't be overriden when deploying the chart.
productShortName: mist

# Settings for docker images used in the chart.
image:
  tag: latest
  pullPolicy: Always
  createSecret:
    enabled: true
    dockerconfigjson: ''

# Victoria Metrics settings.
victoriametrics:
  enabled: true
  # Deploy a Victoria Metrics cluster
  deploy: true
  # Use existing Victoria Metrics cluster
  readEndpoint: ''
  writeEndpoint: ''
  vmselect:
    replicaCount: 1
    extraArgs:
      search:
        # Show the most recent datapoints without any latency
        latencyOffset: 0s
        # Don't cache the last 15m because they may be backfilled by telegraf
        cacheTimestampOffset: 15m
        maxQueryLen: 1GiB
        maxConcurrentRequests: 100
    resources:
      limits:
        cpu: 1
        memory: 300Mi
      requests:
        cpu: 50m
        memory: 30Mi

  vminsert:
    extraArgs:
      # Save space by converting timestamps from milliseconds to seconds
      influxTrimTimestamp: 1s
      maxConcurrentInserts: 20
    replicaCount: 2
    resources:
      limits:
        cpu: 1
        memory: 300Mi
      requests:
        cpu: 50m
        memory: 30Mi
  vmstorage:
    replicaCount: 1
    retentionPeriod: 12
    resources:
      limits:
        cpu: 2
        memory: 1000Mi
      requests:
        cpu: 250m
        memory: 50Mi
      storageSize: 50Gi

enableExternalMessaging: true

# Deployment options (replicas, resource quotas etc).
deployment:
  # Gocky deployment settings.
  gocky:
    enabled: true
    replicas: 1
    autoscaling: &autoscaling
      enabled: false
      minReplicas: 1
      maxReplicas: 20
      targetCPUUtilizationPercentage: 95
      # targetMemoryUtilizationPercentage: 80
      customMetric:
        enabled: false
        name: hpa_custom_metrics_deployment_queues_length
        targetValue: 10
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 1000Mi
        cpu: 100m

  # Portal deployment settings.
  portal:
    replicas: 1
    resources:
      requests:
        memory: 30Mi
        cpu: 10m
      limits:
        memory: 150Mi
        cpu: 100m
    pendo:
      accountId: 'PENDO_ACCOUNT_ID'
      apiKey: 'PENDO_API_KEY'
      enabled: false
