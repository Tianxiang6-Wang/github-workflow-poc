{{ if .Values.deployment.gocky.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-gocky
  labels: &labels
    app: gocky
    chart: {{ include "chart.chart" . }}
    release: {{ include "selector.label.release.name" . }}
    heritage: {{ .Release.Service }}
    hzp-app: gocky
    hzp-role: mist-service
    hzp.iam.webhook/active: '{{ .Values.global.nginx_gw.enabled }}'
spec:
  replicas: {{ .Values.deployment.gocky.replicas | default "1" }}
  selector:
    matchLabels:
      app: gocky
      release: {{ include "selector.label.release.name" . }}
  template:
    metadata:
      labels: *labels
      annotations:
        # Trigger modification of deployment & restart of pods if config changes.
        checksum/config: {{ include (print $.Template.BasePath "/gocky-configmap.yaml") . | sha256sum }}
        hzp.iam.webhook/authentication-enabled: "false"
        hzp.iam.webhook/authorization-enabled: "false"
        hzp.iam.webhook/resources-limits-memory: "2500Mi"
    spec:
      {{- include "images.pullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector: {{- include "pods.nodeSelector" ( list .Values.deployment.gocky $ )| trim | nindent 8 }}
      tolerations: {{- include "pods.tolerations" ( list .Values.deployment.gocky $ ) | trim | nindent 8 }}
      containers:
      - name: gocky
        image: {{ include "manifest.image.name" (dict "data" (index .Values.components "gocky-svc" ) "repo" .Values.global.repository) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: {{ .Values.global.podSecurityContext.runAsUser }}
          runAsGroup: {{ .Values.global.podSecurityContext.runAsGroup }}
        env:
        - name: ORG_ID
          valueFrom:
            secretKeyRef:
              name: mist-org-secret
              key: org-id
              optional: true
        - name: NATS_URL
          value: "nats://jetstream-metrics.{{ .Release.Namespace }}.svc.cluster.local:4222"
        - name: BATCHSIZE
          value: "50"
        command:
        - /bin/sh
        - -c
        args:
        - |
          export VMUSER=$(cat /etc/vm-auth/username)
          export VMPASS=$(cat /etc/vm-auth/password)
          envsubst < /etc/gocky/config.toml > /tmp/gocky-expanded-config.toml &&
          exec /app -config /tmp/gocky-expanded-config.toml
        ports:
        - containerPort: 9096
        - containerPort: 9097
        volumeMounts:
          - name: gocky-config
            mountPath: /etc/gocky/config.toml
            subPath: config.toml
          - name: vm-auth
            mountPath: /etc/vm-auth
            readOnly: true
          {{- include "logLevel.configMap.mount" $ | indent 10 }}  
        resources:
          requests:
            memory: {{ .Values.deployment.gocky.resources.requests.memory | default "100Mi" }}
            cpu: {{ .Values.deployment.gocky.resources.requests.cpu | default "50m" }}
          limits:
            memory: {{ .Values.deployment.gocky.resources.limits.memory | default "500Mi" }}
            cpu: {{ .Values.deployment.gocky.resources.limits.cpu | default "1000m" }}
      initContainers:
        - image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
          imagePullPolicy: Always
          name: init-nats-metrics
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.global.podSecurityContext.runAsUser }}
            runAsGroup: {{ .Values.global.podSecurityContext.runAsGroup }}
            allowPrivilegeEscalation: false
          env:
          - name: NATS_HOST
            value: "jetstream-metrics.{{ .Release.Namespace }}.svc.cluster.local"
          - name: NATS_MONITORING_PORT
            value: "8222"
          command:
          - sh
          - -c
          - |
            echo 'Waiting for Jetstream NATS metrics to become ready...'
            command="wget -S ${NATS_HOST}:${NATS_MONITORING_PORT}/healthz  2>&1 | awk '/^  HTTP/{print $2}'"
            status=$(eval "$command")
            echo "status: $status"
            while [[ "$status" != *"HTTP/1.1 200 OK"* ]]; do
                sleep 2;
                status=$(eval "$command")
                echo "status: $status"
            done;
            echo 'Jetstream metrics OK ✓'
        - image: {{ include "manifest.image.name" (dict "data" (index .Values.components "busybox" ) "repo" .Values.global.repository) }}
          imagePullPolicy: Always
          name: init-vminsert
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.global.podSecurityContext.runAsUser }}
            runAsGroup: {{ .Values.global.podSecurityContext.runAsGroup }}
            allowPrivilegeEscalation: false
          command:
          - sh
          - -c
          - |
            echo 'Waiting for vminsert to become ready...'
            until printf "." && nc -z -w 2 {{ include "chart.fullname" . }}-vminsert 8480; do
                sleep 2;
            done;
            echo 'mist-ee-vminsert ready OK ✓'
      volumes:
      - name: gocky-config
        configMap:
          name: {{ include "chart.fullname" . }}-gocky
      - name: vm-auth
        secret:
          secretName: {{ include "chart.fullname" . }}-victoria-metrics
      {{- include "logLevel.configMap.volume" $ | indent 6 }}
{{- end }}
