apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "microservice.fullname" . }}-binding
subjects:
  - kind: ServiceAccount
    name: {{ template "microservice.fullname" . }}
roleRef:
  kind: Role
  name: {{ template "microservice.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
