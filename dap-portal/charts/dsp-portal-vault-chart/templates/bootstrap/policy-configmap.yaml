{{- $services := list -}}
{{- range .Values.bootstrap.services }}
{{- if .vault }}
  {{- $services = append $services . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: policy-configmap
  namespace: {{ .Release.Namespace }}
data:
{{- range $services }}
  {{ .name }}: |-
{{- if eq .m2m true }}
    path "kv/m2m/{{ .name }}/*" {
      capabilities = ["read", "list"]
    }
{{- end }}
{{- if .vaultPolicies }}
{{ .vaultPolicies | indent 4 }}
{{- end }}
{{- end }}

