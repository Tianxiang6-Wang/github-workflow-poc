{{ if .Values.global.opensearch.deploy -}}
{{- $oldPvc := lookup "v1" "PersistentVolumeClaim" .Release.Namespace "opensearch-0" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensearch-0
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
{{- if $oldPvc }}
  storageClassName: {{ $oldPvc.spec.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.global.opensearch.resources.storageSize }}
{{- else }}
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.global.opensearch.resources.storageSize | default "8Gi" }}
{{- end }}
{{- if .Values.nodeSelector }}
  nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
{{- end }}
{{- end }}
