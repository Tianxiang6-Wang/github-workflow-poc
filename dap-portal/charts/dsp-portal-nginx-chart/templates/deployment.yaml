# NOTE: workaround because .Files.Glob "files/**.template" | sha256sum calculated different checksum for some reason
{{ $checksumConfigsIncludedExternalMtls := sha256sum (tpl (.Files.Glob "files/config_includes/external_mtls/*.template").AsConfig . ) }}
{{ $checksumConfigsIncludedExternalMtlsRecovery := sha256sum (tpl (.Files.Glob "files/config_includes/external_mtls_recovery/*.template").AsConfig . ) }}
{{ $checksumConfigsIncludedExternalTls := sha256sum (tpl (.Files.Glob "files/config_includes/external_tls/*.template").AsConfig . ) }}
{{ $checksumConfigsIncludedInternal := sha256sum (tpl (.Files.Glob "files/config_includes/internal/*.template").AsConfig . ) }}
{{ $checksumConfigsIncluded := sha256sum (print $checksumConfigsIncludedExternalMtls $checksumConfigsIncludedExternalMtlsRecovery $checksumConfigsIncludedExternalTls $checksumConfigsIncludedInternal) }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservice.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "microservice.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "microservice.fullname" . }}

        hzp-app: portal-nginx
      annotations:
        hzp.iam.webhook/authentication-enabled: "false"
        hzp.iam.webhook/authorization-enabled: "false"
        hzp.iam.webhook/exclude-inbound-ports: "443"
        checksum/configsMain: {{ include (print $.Template.BasePath "/configmap-main.yaml") . | sha256sum }}
        checksum/configsIncluded: {{ $checksumConfigsIncluded }}
        checksum/configsLua: {{ tpl (.Files.Glob "files/lua/*").AsConfig . | sha256sum }}
    spec:
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "microservice.fullname" . }}-conf-main
            items:
              - key: nginx.conf
                path: nginx.conf
            defaultMode: 420
        - name: nginx-conf-includes-internal
          configMap:
            name: {{ include "microservice.fullname" . }}-conf-includes-internal
        - name: nginx-conf-includes-tls
          configMap:
            name: {{ include "microservice.fullname" . }}-conf-includes-tls
        - name: nginx-conf-includes-mtls
          configMap:
            name: {{ include "microservice.fullname" . }}-conf-includes-mtls
        - name: nginx-conf-includes-mtls-recovery
          configMap:
            name: {{ include "microservice.fullname" . }}-conf-includes-mtls-recovery
        - name: nginx-lua-scripts
          configMap:
            name: {{ include "microservice.fullname" . }}-lua-scripts
        - name: tls-credentials
          secret:
            secretName: tls-credential
        - name: mtls-credentials
          secret:
            secretName: mtls-credential
        - name: mtls-credentials-recovery
          secret:
            secretName: mtls-credential-recovery
        - name: ip-allowlist-conf
          configMap:
            name: nginx-ip-allowlist-config
      nodeSelector: {{- include "pods.nodeSelector" ( list .Values $ )| trim | nindent 8 }}
      tolerations: {{- include "pods.tolerations" ( list .Values $ ) | trim | nindent 8 }}
      affinity: {{- include "pods.affinity" ( list .Values $ ) | trim | nindent 8 }}
      containers:
        - name: nginx
          image: "{{ .Values.global.registry }}/{{ .Values.image.image }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
          resources: {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              readOnly: true
              mountPath: /etc/nginx
            - name: nginx-conf-includes-internal
              mountPath: /etc/nginx/includes-internal
            - mountPath: /etc/nginx/includes-tls
              name: nginx-conf-includes-tls
            - mountPath: /etc/nginx/includes-mtls
              name: nginx-conf-includes-mtls
            - mountPath: /etc/nginx/includes-mtls-recovery
              name: nginx-conf-includes-mtls-recovery
            - mountPath: /etc/nginx/lua
              name: nginx-lua-scripts
            - name: tls-credentials
              mountPath: "/etc/nginx/tls-credentials"
              readOnly: true
            - name: mtls-credentials
              mountPath: "/etc/nginx/mtls-credentials"
              readOnly: true
            - name: mtls-credentials-recovery
              mountPath: "/etc/nginx/mtls-credentials-recovery"
              readOnly: true
            - name: ip-allowlist-conf
              readOnly: true
              mountPath: /etc/nginx/ip-sources
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
