global:
  registry: "702886132326.dkr.ecr.eu-west-1.amazonaws.com"
  installDependencies: true
  is-saas-env: true
  postgres:
    internal: true
    host:

nameOverride: "dsp-license-svc"
fullnameOverride: "dsp-license-svc"

replicaCount: 1

# values that contains list of tiems for configmap env:
extended_list_env:
extended_list_values:

#replace values from configmap.yaml of your service
#set the configs values Hardcoded from old vluefile env values.
# ALL!!! values must be in QUOTES!!!!
config:
  configmap:

# set all the deployment envs HERE!
# secretname= global.secretname
# keyToEnvName= the name of the env-ar on the pods (dell__Secret__ConnectionStrings__dellConnectionString)
# key = the actual key needed from the secret
# u can add more then 1 secret to use(see in your value global parameter)
externalsecrets:

extraEnvs:
  # db config
  - name: NATS_URL
    value: nats:4222
  - name: NATS_MONITORING_URL
    value: nats:8222
  - name: FUSION_SVC_INTERNAL_URL
    value: "http://dsp-secrets-service"
  - name: ENABLE_FUSION_SECRETS_CLIENT_MOCK
    value: "false"
  - name: ENABLE_M2M_MOCK
    value: "true" # TODO remove after integration with new m2m infra
  - name: EVENTING_TYPE
    value: "nats"
  - name: DYNAMIC_LICENSE_URL
    value: "63db2af836622ad0dbaf4e79273f405f917c318c4eced32f3f65ff4065560b1ac563b968a882ded1845f9668cff3ff5984d16c9eabd5ef34589833ea82b0826692756a24b38c719afb68c21f56cafa4349d1995143fb"
  - name: DELL_DIGITAL_TOKEN_URL
    value: "6b740a0fb8bef6f742e41bc787d2e9b2127db2d54e8be49cca25017a8d013eed51a99f5e796ac8361df74ade89882cbd2c075f4a22e43870261c8d0ecc0802417dc6f4077119d70948f67b8b6d2788"
  - name: DELL_DIGITAL_CLIENT_ID
    value: "1fdc4c8b2925abbc7daee1d2daee3df1c59b615e0899c55e7b69f556f5d2eb1ed06938f62352f90388ca96e8b83edbe98e0525610e9dfccb234ca8a440d9"
  - name: DELL_DIGITAL_CLIENT_SECRET
    value: "77d59a57a7bc16cb917249067c4cdaeb67caf1c7670da1526cc7a3400b49db2bbcb81251b8a5532d14ddf0057a490477c3d2f494edfa2e11825eab34"

image:
  image: "dsp-license-svc"
  tag: ""
  pullPolicy: Always
  imagePullSecrets:
    - name: docker-secret

dbinit:
  postgres:
    enabled: true
    name: dsp-license-svc
    prefix: 
    dbName: "dsp_license_svc"

postgresql-chart:
  fullnameOverride: "postgresql"

# set in deployment.yaml (previously was hardcoded inside the deployment)
entrypoint:
  cmd: dotnet
  arg: ""
  workingDir: "/app"

containerPort:
  http: 8080

terminationGracePeriodSeconds: 30

lifecycle: {}

updateStrategy: {}

extraLabels: []

startupProbe:
  httpGet:
    path: /admin/health/liveness
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /admin/health/liveness
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /admin/health/readiness
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

volumeMounts:
  {}
  # - name: nginx-conf
  #   mountPath: /etc/nginx/nginx.conf
  #   subPath: nginx.conf
  # - name: nginx-conf
  #   mountPath: /etc/nginx/security.conf
  #   subPath: security.conf
  # - name: nginx-conf
  #   mountPath: /etc/nginx/replacements.conf
  #   subPath: replacements.conf

deployment:
  enabled: true

# previus hardcoded in deployment.yaml
# now we can set dell.prod for pproduction apps (as for now all apps are dell.local)
# dnsConfig:
#   searches:

service:
  enabled: true
  type: ClusterIP
  labels: []
  http:
    port: 80
    targetPort: 8080
    nodePort: null
  #Only if you need one service to listen to two ports (Better to split that service to 2 mircoservices.)
  #Must be used with Multiple ingress paths.
  multiPortService:
    enabled: false
    http:
      port: 4999
      name: external
      targetPort: null

ingress:
  enabled: false
  #ALB Annotations: https://kubernetes-sigs.github.io/aws-load-balancer-controller/v2.2/guide/ingress/annotations/#annotations
  annotations: {}
  hosts:
    - path: /
      pathType: ImplementationSpecific

  multipath:
    enabled: true
    hosts:
      - paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              # serviceName: app1-service
              servicePort: 8080
          - path: /health
            pathType: ImplementationSpecific
            backend:
              # serviceName: app1-service
              servicePort: 8080

# Whether or not we want a pod disruption budget, enabled by default, but this only is enabled if replicaCount > 1
podDistuptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "300Mi"

# we should use only HPA OR Keda.
# if keda is needed plz use keda as the cpu\mem scaler
autoscaling: # Only one can be enabled
  keda:
    enabled: false
  minReplicas: 1
  maxReplicas: 3
  hpa:
    enabled: false
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            averageValue: 150m
            type: Utilization
      - type: Resource
        resource:
          name: memory
          target:
            averageValue: 300Mi
            type: Utilization

# criticalinfra = all our criticalinfra apps (namespace criticalinfra)
# infrastructure = internal tools(like devtools apps)
# dell = rest of dell microservices (exclude criticalinfra)
# only 1 selector will be selected!!
nodeSelector:
  {}
  # kubernetes.io/os: linux

# The folowing property is mandetory only for critical infra!!!
# tolerations: {}
tolerations:
  {}
  # - key: "app"
  #   operator: "Equal"
  #   value: "dell"
  # - key: "app"
  #   operator: "Equal"
  #   value: "dell-prod"

volumes:
  {}
  # - name: nginx-conf
  #   configMap:
  #     name: nginx-conf
  #     items:
  #       - key: nginx.conf
  #         path: nginx.conf
  #       - key: security.conf
  #         path: security.conf
  #       - key: replacements.conf
  #         path: replacements.conf

podAntiAffinity:
  enabled: false

topologySpreadConstraints: {}

# Create serviceaccount for the service
serviceAccount:
  enabled: false
  annotations:
    {}
    # Here's an example of assigning an IAM role to a pod
    # eks.amazonaws.com/role-arn: arn:aws:iam::123123123:role/role-name-goes-here

#Commit: DEVOPS-5837-FR-Hashmaps
hashcalculation:
  enabled: false
  # payerstolog: [248,371,444]

  ## Thirdparties
  # Set configurations for third party applications in this section
thirdParties:
  dynatraceVersionDetection:
    enabled: true
