nameOverride: "dsp-notification-service"
fullnameOverride: "dsp-notification-service"

replicaCount: 1

# defaults are dev:
dellEnvironment: "dev"
sslCertificates: "arn:aws:acm:eu-west-1:702886132326:certificate/aa01e3eb-053d-40c7-8f00-5f70741a3b3d"
albName: "dev.sp.dell.com"
albGroupName: "saas-dsp-portal-dev"
domain: "dev.sp.dell.com"

global:
  installDependencies: true
  registry: "702886132326.dkr.ecr.eu-west-1.amazonaws.com"
  postgres:
    internal: true
    host:

# values that contains list of tiems for configmap env:
extended_list_env:
extended_list_values:


#replace values from configmap.yaml of your service
#set the configs values Hardcoded from old vluefile env values.
# ALL!!! values must be in QUOTES!!!!
config:
  configmap:


# set all the deployment envs HERE!
# secretname= global.secretname
# keyToEnvName= the name of the env-ar on the pods (dell__Secret__ConnectionStrings__dellConnectionString)
# key = the actual key needed from the secret
# u can add more then 1 secret to use(see in your value global parameter)
externalsecrets:

extraEnvs:
  - name: FUSION_SVC_INTERNAL_URL
    value: "http://dsp-secrets-service"
  - name: CERT_SVC_INTERNAL_URL
    value: "http://dsp-portal-certificate-svc"
  # - name: APPROLE_ID_PATH
  #   value: "eo-approle"
  # - name: AUTH_CLIENT_ID
  #   value: "hzp-notification-svc"
  # - name: VAULT_CERTS_KV_MOUNT_POINT
  #   value: "kv/m2m/hzp-notification-svc"
  - name: SESSION_SERVICE_URL
    value: "http://dsp-iam-session-svc"
  # - name: APPROLE_ID
  #   valueFrom:
  #     secretKeyRef:
  #       name: hzp-notification-svc-vault-secret
  #       key: role-id
  #       optional: true # TODO by right this should not be optional. m2m will not work without valid value of this env
  # - name: APPROLE_SECRET_ID
  #   valueFrom:
  #     secretKeyRef:
  #       name: hzp-notification-svc-vault-secret
  #       key: secret-id
