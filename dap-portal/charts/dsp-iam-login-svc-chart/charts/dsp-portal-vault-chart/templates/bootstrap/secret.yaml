{{- $services := list -}}
{{- range .Values.bootstrap.services }}
{{- if .vault }}
  {{- $services = append $services . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bootstrap.vault.auth.secretName }}
  labels:
    app: hzp
type: Opaque
{{/*---*/}}
{{/*apiVersion: v1*/}}
{{/*kind: Secret*/}}
{{/*metadata:*/}}
{{/*  name: {{ .Values.bootstrap.keycloak.auth.vaultSecretName }}*/}}
{{/*  labels:*/}}
{{/*    app: hzp*/}}
{{/*type: Opaque*/}}

{{- range $services}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-vault-secret
  labels:
    app: hzp
type: Opaque
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bootstrap.keycloak.auth.secretName }}
  labels:
    app: hzp
type: Opaque
data:
  keycloak-password: {{ include "common.secrets.passwords.manage" (dict "secret" .Values.bootstrap.keycloak.auth.secretName "key" "keycloak-password" "providedValues" (list "bootstrap.keycloak.auth.keycloakAdminPassword")  "strong" true "context" $) }}
  security-admin-usr-pwd: {{ include "common.secrets.passwords.manage" (dict "secret" .Values.bootstrap.keycloak.auth.secretName "key" "security-admin-usr-pwd" "providedValues" (list "bootstrap.keycloak.auth.keycloakSecurityAdminUsrPassword")  "strong" true "context" $) }}
  dell-security-admin-usr-pwd: {{ include "common.secrets.passwords.manage" (dict "secret" .Values.bootstrap.keycloak.auth.secretName "key" "dell-security-admin-usr-pwd" "providedValues" (list "bootstrap.keycloak.auth.dellSecurityAdminUsrPassword") "strong" true "context" $) }}
  auth-client-pwd: {{ include "common.secrets.passwords.manage" (dict "secret" .Values.bootstrap.keycloak.auth.secretName "key" "auth-client-pwd" "providedValues" (list "bootstrap.keycloak.auth.keycloakAuthClientPassword") "length" 32 "strong" true "context" $) }}
  iam-client-pwd: {{ include "common.secrets.passwords.manage" (dict "secret" .Values.bootstrap.keycloak.auth.secretName "key" "iam-client-pwd" "providedValues" (list "bootstrap.keycloak.auth.keycloakIAMClientPassword") "length" 32 "strong" true "context" $) }}
  delco-client-pwd: {{ include "common.secrets.passwords.manage" (dict "secret" .Values.bootstrap.keycloak.auth.secretName "key" "delco-client-pwd" "providedValues" (list "bootstrap.keycloak.auth.keycloakDELCOClientPassword") "length" 32 "strong" true "context" $) }}
  iam-client-name: {{ "iam-client" | b64enc | quote }}
  auth_client-name: {{ "auth-client" | b64enc | quote }}
  delco-client-name: {{ "hzp-delco-client" | b64enc | quote }}
  automation-client-name: {{ "automation-client" | b64enc | quote }}
  automation-client-pwd: {{ include "common.secrets.passwords.manage" (dict "secret" .Values.bootstrap.keycloak.auth.secretName "key" "automation-client-pwd" "providedValues" (list "bootstrap.keycloak.auth.automationClientPassword") "length" 32 "strong" true "context" $) }}