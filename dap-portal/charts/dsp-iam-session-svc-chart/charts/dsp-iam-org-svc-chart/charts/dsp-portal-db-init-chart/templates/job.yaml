{{- if and .Values.postgres.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "microservice.jobname" . }}"
  namespace: {{ .Release.Namespace }}
  annotations:
    dbtype: postgresql
spec:
  ttlSecondsAfterFinished: 60  # Deletes the Job 5 minutes after completion
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "microservice.jobname" . }}
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: "{{ include "microservice.jobname" . }}"
        image: "{{ .Values.global.registry }}/dsp-portal-db-init:{{ .Chart.AppVersion }}"
        command: ["/bin/bash", "-c"]
        args:
          - |
            #!/bin/bash

            # Set PostgreSQL connection details
            host="$POSTGRES_HOST"
            echo $host
            user="postgres"
            # User,password and database
            password="${DB_PASSWORD}"
            database="${DB_NAME}"
            export PGPASSWORD=$POSTGRES_PASSWORD
            secret_key="{{ default (.Release.Name | replace "-chart" "") .Values.postgres.name }}"

            # Check if the developer is set up the database name or not
            if [[ "$database" == *"default"* ]]; then
              echo "The DB_NAME '$database' cannot be empty in the configuration, please add it in values file."
              exit 1
            fi

            # Check if the database is up or not
            for i in {1..30}; do
              if nc -zv $host 5432; then
                echo "The database postgres is up!"
                break
              fi
              echo "Retrying in 10s..."
              sleep 10
            done
            
            KEY_VALUE=$(kubectl get secret postgresql -n {{ .Release.Namespace }} -o jsonpath="{.data.$secret_key}" 2>/dev/null)
            if [[ -n "$KEY_VALUE" ]]; then
              echo "Skip initializing database as the password of the user $database exists in secret postgresql."
              exit 0
            fi

            if psql -h $host -U $user  -tXAc "SELECT 1 FROM pg_database WHERE datname='${database}'" | grep -q 1; then
              echo "Skip initializing the database '${database}' as it already exists."
              DB_EXIST="true"
            else
              echo "Database '${database}' does not exist. Creating..."
              DB_EXIST="false"
            fi
            
            if psql -h $host -U $user  -tXAc "SELECT 1 FROM pg_roles WHERE rolname='${USERNAME}'" | grep -q 1; then
              echo "Skip creating user '${database}' as it already exists."
              USER_EXIST="true"
            else
              echo "User '${database}' does not exist. Creating..."
              USER_EXIST="false"
            fi
            
            if [[ USER_EXIST == "true" && DB_EXIST == "true" ]]; then
              echo "Skip creating user and database '${database}' as they are already exist."
              exist 0
            fi

            # Create a template database with pgcrypto and uuid-ossp extensions
            psql -h $host -U $user -tc "SELECT 1 FROM pg_database WHERE datname = 'template_pgcrypto'" | grep -q 1 || \
            psql -h $host -U $user -d postgres -c "CREATE DATABASE template_pgcrypto;"

            psql -h $host -U $user -d template_pgcrypto -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
            psql -h $host -U $user -d template_pgcrypto -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"

            # Refresh collation version and reindex template1 to avoid future issues
            psql -h $host -U $user -d postgres -c "ALTER DATABASE template1 REFRESH COLLATION VERSION;"
            psql -h $host -U $user -d template1 -c "REINDEX DATABASE template1;"

            for name in $database; do
              if [[ !DB_EXIST ]];then
                echo "Creating database: $name"
                
              fi
              
              psql -h $host -U $user -tc "SELECT 1 FROM pg_database WHERE datname = '$name'" | grep -q 1 || \
              psql -h $host -U $user -c "CREATE DATABASE \"$name\" TEMPLATE template_pgcrypto;"

              psql -h $host -U $user -tc "SELECT 1 FROM pg_roles WHERE rolname = '$name'" | grep -q 1 || \
              psql -h $host -U $user -c "CREATE ROLE \"$name\";"

              psql -h $host -U $user -c "ALTER DATABASE \"$name\" OWNER TO \"$name\""
              psql -h $host -U $user -d $name -c "GRANT ALL PRIVILEGES ON DATABASE \"$name\" TO \"$name\""
              psql -h $host -U $user -d $name -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"$name\""

              for tbl in $(psql -h $host -U $user -d $name -Atc "SELECT tablename FROM pg_tables WHERE schemaname = 'public';"); do
                psql -h $host -U $user -d $name -c "ALTER TABLE \"$tbl\" OWNER TO \"$name\""
              done

              for matview in $(psql -h $host -U $user -d $name -Atc "SELECT matviewname FROM pg_matviews WHERE schemaname = 'public';"); do
                psql -h $host -U $user -d $name -c "ALTER MATERIALIZED VIEW \"$matview\" OWNER TO \"$name\""
              done

              for oid in $(psql -h $host -U $user -d $name -Atc "SELECT oid FROM pg_largeobject_metadata;"); do
                psql -h $host -U $user -d $name -c "GRANT SELECT ON LARGE OBJECT $oid TO \"$name\""
              done
              echo "user: $name, password: $password"
              psql -h $host -U $user -c "ALTER ROLE \"$name\" WITH LOGIN ENCRYPTED PASSWORD '$password'"

              if psql -h $host -U $user -d $name -tc "SELECT 1 FROM pg_namespace WHERE nspname = 'locales'" | grep -q 1; then
                localetable=$(psql -h $host -U $user -d $name -Atc "SELECT tablename FROM pg_tables WHERE schemaname = 'locales' LIMIT 1;")
                if [ -n "$localetable" ]; then
                  psql -h $host -U $user -d $name -c "ALTER TABLE locales.$localetable OWNER TO \"$name\""
                fi
                psql -h $host -U $user -d $name -c "ALTER SCHEMA locales OWNER TO \"$name\""
                psql -h $host -U $user -d $name -c "GRANT USAGE ON SCHEMA locales TO \"$name\""
              fi
            done

            secret="${POSTGRES_SECRET}"
            # Check if the secret already exists
            password=$(echo -n "$password" | base64)
            if kubectl get secret $secret -n {{ .Release.Namespace }}; then
              kubectl -n {{ .Release.Namespace }} patch secret $secret -p="{\"data\":{\"$secret_key\": \"$password\"}}"
            else
              echo "The secret $secret is not exist."
              exit 1
            fi

            # Delete serviceaccount role rolebinding after the DB initialization completed with ownerReferences configuration
            JOB_UID=$(kubectl get job ${SERVICE_NAME} -o jsonpath='{.metadata.uid}')
            DELETE_RESOURCES="serviceaccount role rolebinding"
            for resource in ${DELETE_RESOURCES}; do
                kubectl patch $resource ${SERVICE_NAME} --type='json' -p="[{
                  \"op\": \"add\",
                  \"path\": \"/metadata/ownerReferences\",
                  \"value\": [{
                    \"apiVersion\": \"batch/v1\",
                    \"kind\": \"Job\",
                    \"name\": \"${SERVICE_NAME}\",
                    \"uid\": \"${JOB_UID}\",
                    \"controller\": true,
                    \"blockOwnerDeletion\": true
                  }]
                }]"
            done

            echo "DB initialization completed successfully."
        env:
          - name: SERVICE_NAME
            value: "{{ include "microservice.jobname" . }}"
        {{- if .Values.postgres.external }}
          - name: POSTGRES_HOST
            value: {{ .Values.postgres.host }}
          - name: POSTGRES_PASSWORD
            value: {{ .Values.postgres.password }}
        {{- else }}
          - name: POSTGRES_HOST
            value: postgresql.{{ .Release.Namespace }}.svc.cluster.local
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "postgresql"
                key: "postgres-password"
          - name: POSTGRES_SECRET
            value: "postgresql"
        {{- end}}
          - name: DB_NAME # The db username is the same as the db name by design
        {{- if .Values.postgres.prefix }}
            value: {{ printf "%s-%s" .Values.postgres.prefix (.Values.postgres.dbName | default "default") }}
        {{ else }}
            value: {{ .Values.postgres.dbName | default "default" }}
        {{- end }}
          - name: DB_PASSWORD
            value: "{{ randAlphaNum 12 }}"
{{ end }}
