{{- if .Values.deployment.enabled }}
{{ $buildid := default false (hasKey .Values.config "env") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservice.fullname" . }}
  namespace: {{ include "microservice.namespace" . | quote }}
  labels:
{{ include "microservice.labels" . | indent 4 }}
{{- with .Values.extraLabels }}
{{- toYaml . | nindent 4 }}
{{- end }}
spec:
  # if autoscaling enabled, replicas not needed
  {{- if and (not .Values.autoscaling.hpa.enabled) (not .Values.autoscaling.keda.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.updateStrategy }}
  strategy:
    {{ toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
    {{- include "microservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{ if not .Values.global.authnzEnabled}}
        hzp.iam.webhook/authentication-enabled: "false"
        hzp.iam.webhook/authorization-enabled: "false"
        {{- end }}
      labels:
        hzp-app: dsp-iam-session-svc

        hzp.iam.webhook/bootstrap: "true"
        {{- if not (empty $buildid) }}
        dellAppVersion: {{ include "microservice.version" . | quote }}
        {{- end }}
        {{- include "microservice.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dnsConfig }}
      dnsConfig: {{ toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "microservice.fullname" . }}
          image: "{{ .Values.global.registry }}/{{ .Values.image.image }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          imagePullPolicy: {{ .Values.image.pullPolicy }}
#          command: ["{{ .Values.entrypoint.cmd }}"]
#          args: ["{{ .Values.entrypoint.arg }}"]
          {{- if .Values.entrypoint.workingDir }}
          workingDir: {{ .Values.entrypoint.workingDir }}
          {{- end }}
          {{- if .Values.lifecycle }}
          lifecycle: {{ toYaml .Values.lifecycle | nindent 12 }}
          {{- end }}
          env:
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  key: ISSUER
                  name: dsp-iam-token-svc
                  optional: true
            {{- if and .Values.thirdParties.dynatraceVersionDetection.enabled $buildid }}
            - name: DT_RELEASE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['dellAppVersion']
            - name: DT_RELEASE_PRODUCT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/name']
            - name: DT_RELEASE_BUILD_VERSION
              value: {{ now | date "2006-01-02" }}
            - name: DT_RELEASE_STAGE
              value: {{ .Values.dellEnvironment }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KubeNamespace
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: USE_LATEST_LIB
              value: "true"
            - name: IS_PORTAL
              value: "true"
            - name: HZP_IAM_SVC_URL
              value: "http://dsp-iam-mgmt-svc"
            - name: CUSTOM_IAM_CA_DIRECTORIES_PATHS
              value: "/etc/dsp-iam-session-svc/certs"
            {{ if  (index .Values.global "is-saas-env") }}
            - name: DSP_ON_PREM
              value: "false"
            - name: EXTERNAL_AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: di-client-secret
                  key: di-auth-client-name
                  optional: true
            - name: EXTERNAL_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: di-client-secret
                  key: di-auth-client-password
                  optional: true
            - name: EXTERNAL_ISSUER_BASE_URL
              value: {{ .Values.di.externalIssuer }}
            - name: EXTERNAL_AUTH_BASE_URL
              value: {{ .Values.di.baseUrl }}
            - name: EXTERNAL_AUTH_TOKEN_ENDPOINT
              value: {{ .Values.di.tokenPath }}
            {{ else }}
            - name: DSP_ON_PREM
              value: "true"
            - name: EXTERNAL_AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: auth_client-name
            - name: EXTERNAL_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: auth-client-pwd
            - name: EXTERNAL_AUTH_BASE_URL
              value: "http://dsp-iam-login-svc-http"
            - name: EXTERNAL_AUTH_TOKEN_ENDPOINT
              value: "{{ printf "/auth/realms/%s/protocol/openid-connect/token" .Values.global.staticOnPremOrgId }}"
            - name: KEYCLOAK_ORG_NAME
              value: {{ .Values.global.staticOnPremOrgId }}
            {{ end }}
            - name: COOKIE_ROOT_DOMAIN
              value: {{ .Values.global.cookie_domain }}
            {{- if and .Values.dbinit.postgres.enabled }}
            {{- if .Values.global.postgres.internal }}
            - name: DB_HOST
              value: postgresql.{{ .Release.Namespace }}.svc.cluster.local
            {{- else }}
            - name: DB_HOST
              value: {{ .Values.global.postgres.host }}
            {{- end }}
            {{- if .Values.dbinit.postgres.prefix }}
            - name: DB_USER # The db username is the same as the db name by design
              value: {{ printf "%s-%s" .Values.dbinit.postgres.prefix (.Values.dbinit.postgres.dbName | default "default") }}
            {{ else }}
            - name: DB_USER # The db username is the same as the db name by design
              value: {{ .Values.dbinit.postgres.dbName | default "default" }}
            {{- end }}
            - name: DB_PORT
              value: "5432"
            - name: DB_PA
              valueFrom:
                secretKeyRef:
                  name: "postgresql"
                  key: {{ include "microservice.fullname" . }}
            {{- end }}
          {{- range $secret := .Values.externalsecrets }}
          {{- range $key := $secret.keys }}
            - name: {{ $key.keyToEnvName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.secretname }}
                  key: {{ $key.key }}
          {{- end }}
          {{- end }}
          {{- if .Values.extraEnvs }}
            {{- toYaml .Values.extraEnvs | nindent 12 }}
          {{- end }}

          ports:
          {{- range $key, $value := .Values.containerPort }}
            - name: {{ $key }}
              containerPort: {{ $value }}
              protocol: TCP
          {{- end }}
          
          envFrom:
          - configMapRef:
              name: {{ include "microservice.fullname" . }}
          # - secretRef:
          #     name: {{ include "microservice.fullname" . }}

          {{- if .Values.startupProbe }}
          startupProbe: {{ toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          livenessProbe: {{ toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe: {{ toYaml .Values.readinessProbe | nindent 12 }}
          {{- if .Values.volumeMounts }}
          volumeMounts: {{ toYaml .Values.volumeMounts | nindent 12 }}
          {{- end }}

          {{- if .Values.resources }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- end }}
    {{- if .Values.volumes }}
      volumes: {{ toYaml .Values.volumes | nindent 8 }}
    {{- end }}
    {{- if .Values.nodeSelector }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      {{- if or (eq .Values.nodeSelector.app "dell") (eq .Values.nodeSelector.app "infra") (eq .Values.nodeSelector.app "infra-devops") }}
        karpenter.sh/capacity-type: spot
      {{- end }}
      {{- if or (eq .Values.nodeSelector.app "dell-prod") (eq .Values.nodeSelector.app "infra-prod") }}
        karpenter.sh/capacity-type: on-demand
      {{- end }}
    {{- end }}
    {{- if .Values.tolerations }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
    {{- end }}
    {{- if .Values.podAntiAffinity.enabled }}
      affinity: 
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 5
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - {{ include "microservice.fullname" . }}
              topologyKey: "kubernetes.io/hostname"      
    {{- end }}
    {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml .Values.topologySpreadConstraints | nindent 8 }}
    {{- end }}
    
    {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ template "microservice.fullname" . }}
    {{- end }}
{{- end }}
