{{- if .Values.global.iamAuthZEnabled }}
{{ $svc := .Values.webhookSvc}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  labels:
    hzp-app: {{ $svc.name }}
spec:
  publishNotReadyAddresses: true
  ports:
    - port: {{ $svc.servicePort }}
      targetPort: {{ $svc.port }}
  selector:
    hzp-app: {{ $svc.name }}

  {{end}}
  