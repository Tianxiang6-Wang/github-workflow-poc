{{- if .Values.global.iamAuthZEnabled }}
{{- $svc := .Values.webhookSvc -}}
{{- $proxyContainer := .Values.proxyContainer -}}
{{- $initContainer := .Values.initContainer -}}
{{ $specConfig := .Values.containerSpecConfig}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hzp-iam-webhook
  labels:
    hzp-app: hzp-iam-webhook
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      hzp-app: {{ $svc.name }}
  template:
    metadata:
      name: {{ $svc.name }}
      labels:
{{- tpl (toYaml .Values.webhook.podLabels) . | replace "'" "" | nindent 8 }}
    spec:
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector: {{- include "pods.nodeSelector" ( list .Values.webhookSvc $ ) | trim | nindent 8 }}
      tolerations: {{- include "pods.tolerations" ( list .Values.webhookSvc $ ) | trim | nindent 8 }}
      affinity: {{- include "pods.affinity" ( list .Values.webhookSvc $ ) | trim | nindent 8 }}
      serviceAccountName: {{ .Values.bootstrap.name }}
      containers:
        - name: {{ $svc.name }}
          image: "{{ .Values.global.registry }}{{ $svc.image.name }}:{{ $svc.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- toYaml $svc.env | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $specConfig.name }}
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            failureThreshold: 30
            httpGet:
              path: /admin/health/dependency
              port: {{$svc.healthCheckPort}}
              scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 3
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - name: ca-pemstore
              mountPath: /etc/ssl/certs/cert.pem
              subPath: cert.pem
              readOnly: true
            - name: keystore
              mountPath: /etc/ssl/keys/key.pem
              subPath: key.pem
              readOnly: true
            {{ include "logLevel.configMap.mount" $ | indent 12 }}
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: ca-pemstore
          secret:
            secretName: {{ $svc.name }}
            items:
              - key: ca.crt
                path: cert.pem
        - name: keystore
          secret:
            secretName: {{ $svc.name }}
            items:
              - key: key.crt
                path: key.pem
       {{ include "logLevel.configMap.volume" $ | indent 8 }}
  {{end}}
