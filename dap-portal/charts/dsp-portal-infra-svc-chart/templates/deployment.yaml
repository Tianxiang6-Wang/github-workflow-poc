{{- if .Values.deployment.enabled }}
{{ $buildid := default false (hasKey .Values.config "env") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservice.fullname" . }}
  namespace: {{ include "microservice.namespace" . | quote }}
  labels:
{{ include "microservice.labels" . | indent 4 }}
{{- with .Values.extraLabels }}
{{- toYaml . | nindent 4 }}
{{- end }}
spec:
  # if autoscaling enabled, replicas not needed
  {{- if and (not .Values.autoscaling.hpa.enabled) (not .Values.autoscaling.keda.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.updateStrategy }}
  strategy:
    {{ toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
    {{- include "microservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        hzp.iam.webhook/authentication-enabled: "true"
        hzp.iam.webhook/authorization-enabled: "true"
        prometheus.io/port: "{{ .Values.containerPort.http }}"
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
      labels:
        hzp-app: "dsp-portal-infra-svc"
        hzp-role: "dapp"

        {{- if not (empty $buildid) }}
        dellAppVersion: {{ include "microservice.version" . | quote }}
        {{- end }}
        {{- include "microservice.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dnsConfig }}
      dnsConfig: {{ toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "microservice.fullname" . }}
          image: "{{ .Values.global.registry }}/{{ .Values.image.image }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.entrypoint }}
          {{- if .Values.entrypoint.cmd }}
          command: ["{{ .Values.entrypoint.cmd }}"]
          {{- end }}
          {{- if .Values.entrypoint.arg }}
          args: ["{{ .Values.entrypoint.arg }}"]
          {{- end }}
          {{- end }}
          {{- if .Values.lifecycle }}
          lifecycle: {{ toYaml .Values.lifecycle | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          env:
            {{- if .Values.vms.enabled }}
            - name: VMS_ACCESS_TOKEN_ENDPT
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}
                  key: "VMS_ACCESS_TOKEN_ENDPT"
            - name: VMS_ACCESS_TOKEN_TYPE
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}
                  key: "VMS_ACCESS_TOKEN_TYPE"
            - name: VMS_XFER_VOUCHER_ENDPT
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}
                  key: "VMS_XFER_VOUCHER_ENDPT"
            - name: VMS_XFER_VOUCHER_TYPE
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}
                  key: "VMS_XFER_VOUCHER_TYPE"
            - name: VMS_XFER_VOUCHER_OAUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}
                  key: "VMS_XFER_VOUCHER_OAUTH"
            - name: VMS_XFER_VOUCHER_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}
                  key: "VMS_XFER_VOUCHER_APP_ID"
            - name: VMS_XFER_VOUCHER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}
                  key: "VMS_XFER_VOUCHER_SECRET"
            {{- end }}
            {{- if and .Values.thirdParties.dynatraceVersionDetection.enabled $buildid }}
            - name: DT_RELEASE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['dellAppVersion']
            - name: DT_RELEASE_PRODUCT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/name']
            - name: DT_RELEASE_BUILD_VERSION
              value: {{ now | date "2006-01-02" }}
            - name: DT_RELEASE_STAGE
              value: {{ .Values.dellEnvironment }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KubeNamespace
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if and .Values.dbinit.postgres.enabled }}
            {{- if .Values.global.postgres.internal }}
            - name: DB_HOST
              value: postgresql.{{ .Release.Namespace }}.svc.cluster.local
            {{- else }}
            - name: DB_HOST
              value: {{ .Values.global.postgres.host }}
            {{- end }}
            {{- if .Values.dbinit.postgres.prefix }}
            - name: DB_USER # The db username is the same as the db name by design
              value: {{ printf "%s-%s" .Values.dbinit.postgres.prefix (.Values.dbinit.postgres.dbName | default "default") }}
            - name: DB_NAME # The db username is the same as the db name by design
              value: {{ printf "%s-%s" .Values.dbinit.postgres.prefix (.Values.dbinit.postgres.dbName | default "default") }}
            {{ else }}
            - name: DB_USER # The db username is the same as the db name by design
              value: {{ .Values.dbinit.postgres.dbName | default "default" }}
            - name: DB_NAME # The db username is the same as the db name by design
              value: {{ .Values.dbinit.postgres.dbName | default "default" }}
            {{- end }}
            - name: DB_PORT
              value: "5432"
            - name: DB_PA
              valueFrom:
                secretKeyRef:
                  name: "postgresql"
                  key: {{ include "microservice.fullname" . }}
            {{- end }}
          {{- range $secret := .Values.externalsecrets }}
          {{- range $key := $secret.keys }}
            - name: {{ $key.keyToEnvName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.secretname }}
                  key: {{ $key.key }}
          {{- end }}
          {{- end }}
          {{- if .Values.extraEnvs }}
            {{- tpl (toYaml .Values.extraEnvs) . | nindent 12 }}
          {{- end }}

          ports:
          {{- range $key, $value := .Values.containerPort }}
            - name: {{ $key }}
              containerPort: {{ $value }}
              protocol: TCP
          {{- end }}
          
          envFrom:
          - configMapRef:
              name: {{ include "microservice.fullname" . }}
          # - secretRef:
          #     name: {{ include "microservice.fullname" . }}

          {{- if .Values.startupProbe }}
          startupProbe: {{ toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          livenessProbe: {{ toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe: {{ toYaml .Values.readinessProbe | nindent 12 }}
          {{- if .Values.volumeMounts }}
          volumeMounts: {{ toYaml .Values.volumeMounts | nindent 12 }}
          {{- end }}

          {{- if .Values.resources }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- end }}
      initContainers:
      - name: init-dependencies
        image: "{{ .Values.global.registry }}/{{ .Values.init.image }}:{{ .Values.init.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          {{- if .Values.extraEnvs }}
            {{- tpl (toYaml .Values.extraEnvs) . | nindent 10 }}
          {{- end }}
          {{- if and .Values.dbinit.postgres.enabled }}
          {{- if .Values.global.postgres.internal }}
          - name: DB_HOST
            value: postgresql.{{ .Release.Namespace }}.svc.cluster.local
          {{- else }}
          - name: DB_HOST
            value: {{ .Values.global.postgres.host }}
          {{- end }}
          {{- if .Values.dbinit.postgres.prefix }}
          - name: DB_USER # The db username is the same as the db name by design
            value: {{ printf "%s-%s" .Values.dbinit.postgres.prefix (.Values.dbinit.postgres.dbName | default "default") }}
          - name: DB_NAME # The db username is the same as the db name by design
            value: {{ printf "%s-%s" .Values.dbinit.postgres.prefix (.Values.dbinit.postgres.dbName | default "default") }}
          {{ else }}
          - name: DB_USER # The db username is the same as the db name by design
            value: {{ .Values.dbinit.postgres.dbName | default "default" }}
          - name: DB_NAME # The db username is the same as the db name by design
            value: {{ .Values.dbinit.postgres.dbName | default "default" }}
          {{- end }}
          - name: DB_PORT
            value: "5432"
          - name: DB_PA
            valueFrom:
              secretKeyRef:
                name: "postgresql"
                key: "{{ include "microservice.fullname" . }}"
          {{- end }}
        securityContext:
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        command:
          - sh
          - -c
          - |
            echo 'Waiting for PostgreSQL to become ready...'
            until printf "." && nc -z -w 2 $DB_HOST $DB_PORT; do
                sleep 2;
            done;
            echo 'PostgreSQL OK ✓'

            echo 'Waiting for Jetstream to become ready...'
            command="wget -S ${NATS_MONITORING_URL}/healthz  2>&1 | awk '/^  HTTP/{print $2}'"
            status=$(eval "$command")
            echo "status: $status"
            while [[ "$status" != *"HTTP/1.1 200 OK"* ]]; do
                sleep 2;
                status=$(eval "$command")
                echo "status: $status"
            done;
            echo 'Jetstream OK ✓'
    {{- if .Values.volumes }}
      volumes: {{ toYaml .Values.volumes | nindent 8 }}
    {{- end }}
    {{- if .Values.nodeSelector }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      {{- if or (eq .Values.nodeSelector.app "dell") (eq .Values.nodeSelector.app "infra") (eq .Values.nodeSelector.app "infra-devops") }}
        karpenter.sh/capacity-type: spot
      {{- end }}
      {{- if or (eq .Values.nodeSelector.app "dell-prod") (eq .Values.nodeSelector.app "infra-prod") }}
        karpenter.sh/capacity-type: on-demand
      {{- end }}
    {{- end }}
    {{- if .Values.tolerations }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
    {{- end }}
    {{- if .Values.podAntiAffinity.enabled }}
      affinity: 
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - {{ include "microservice.fullname" . }}
              topologyKey: "kubernetes.io/zone"      
    {{- end }}
    {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml .Values.topologySpreadConstraints | nindent 8 }}
    {{- end }}
    
    {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ template "microservice.fullname" . }}
    {{- end }}
{{- end }}
