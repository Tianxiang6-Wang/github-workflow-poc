{{- if .Values.secrets.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: secrets
  name: {{ include "microservice.fullname" . }}-secrets-migrate-db
  annotations:
    "helm.sh/hook": "post-upgrade"
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": "before-hook-creation"
spec:
  backoffLimit: 5
  parallelism: 1
  template:
    metadata:
      labels:
        app: secrets
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: {{ .Values.migrateDbJobSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.migrateDbJobSecurityContext.runAsGroup }}
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secrets-db-migrator
          image: "{{ .Values.global.registry }}/{{ .Values.image.migrateDbJobImage }}:{{ .Values.image.migrateDbJobImageTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/python
            - -m
            - service.db_migrator.migrate
          env:
            {{- include "fusion-services.vault_env_vars" . | nindent 12 }}
            {{- include "fusion-services.postgres_env_vars" (dict "dbRoot" .Values.db "root" $) | nindent 12 }}
            {{- include "fusion-services.postgres_env_vars" (dict "dbRoot" .Values.db.dbMigrator "root" $ "envPrefix" "SRC_") | nindent 12 }}
            - name: VAULT_SECRET_PATH
              value: {{ tpl .Values.vault.vaultSecretPath $ }}
            - name: LOGGING_LEVEL_CONFIGURATION_PATH
              value: "/opt/logging"
            - name: LOGGING_LEVEL_GLOBAL_PATH
              value: "/opt/logging/"
            - name: LOGGING_LEVEL_SERVICE_PATH
              value: "/opt/logging/fusion-secrets"
          {{- if .Values.volumeMounts }}
          volumeMounts: {{ toYaml .Values.volumeMounts | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "microservice.fullname" . }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          {{- if .Values.resources }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- end }}
      restartPolicy: OnFailure
      {{- if .Values.volumes }}
      volumes: {{ toYaml .Values.volumes | nindent 8 }}
      {{- end }}
{{- end }}
