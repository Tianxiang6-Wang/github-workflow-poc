global:
  registry: "702886132326.dkr.ecr.eu-west-1.amazonaws.com"
  installDependencies: true
  standAloneDeploy: true
  postgres:
    internal: true
    host:

nameOverride: "dsp-secrets-service"
fullnameOverride: "dsp-secrets-service"

replicaCount: 1

# defaults are dev:
dellEnvironment: "dev"
sslCertificates: "arn:aws:acm:eu-west-1:702886132326:certificate/aa01e3eb-053d-40c7-8f00-5f70741a3b3d"
albName: "dev.sp.dell.com"
albGroupName: "saas-dsp-portal-dev"
domain: "dev.sp.dell.com"

# values that contains list of tiems for configmap env:
extended_list_env:
extended_list_values:


#replace values from configmap.yaml of your service
#set the configs values Hardcoded from old vluefile env values.
# ALL!!! values must be in QUOTES!!!!
config:
  configmap:
    REST_PROTOCOL: http
    REST_HOST: fusion-entrypoint
    REST_PORT: 80


# set all the deployment envs HERE!
# secretname= global.secretname
# keyToEnvName= the name of the env-ar on the pods (dell__Secret__ConnectionStrings__dellConnectionString)
# key = the actual key needed from the secret
# u can add more then 1 secret to use(see in your value global parameter)
externalsecrets:

image:
  image: "eo-images/fusion-manager-secrets-service"
  tag: "25-05-29_13-25_main_5222671"
  initImage: "eo-images/fusion-manager-restservice"
  initImageTag: "25-05-26_02-38_main_7fe906c4a"
  migrateDbJobImage: "eo-images/fusion-manager-secrets-service"
  migrateDbJobImageTag: "25-05-25_23-48_main_1b7bcd8"
  pullPolicy: Always
  imagePullSecrets:
   - name: docker-secret

# set in deployment.yaml (previously was hardcoded inside the deployment)
entrypoint:
  cmd: "./main"
  arg: ""
  workingDir: "/home/iamsession"

containerPort:
  http: 8100

terminationGracePeriodSeconds: 30

lifecycle: {}

updateStrategy: {}

extraLabels: []
db:
  host: "postgresql"
  port: "5432"
  dbName: "fusion_db"
  k8sSecret:
    name: "postgresql"
    key: "dsp-secrets-service"
  dbMigrator:
    host: "postgresql"
    port: "5432"
    dbName: "fusion_db"



initContainerSecurityContext:
  # -- Run process with user ID
  runAsUser: 1000
  # -- Run process with group ID
  runAsGroup: 1000
# -- Specify security context for migrate db job
migrateDbJobSecurityContext:
  # -- Run process with user ID
  runAsUser: 1000
  # -- Run process with group ID
  runAsGroup: 1000

startupProbe:
  httpGet:
    path: /admin/health/dependency
    port: 14000
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /health
    port: 8100
    scheme: HTTP
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /admin/health/dependency
    port: 14000
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

volumeMounts:
  - name: logging
    mountPath: /opt/logging
    readOnly: true
  - name: vault-secret
    mountPath: /opt/vault/secret/
    readOnly: true
volumes:
  - name: vault-secret
    secret:
      secretName: fusion-svc-vault-secret
  - name: logging
    configMap:
      name: fusion-log-levels-config

deployment:
  enabled: true

# previus hardcoded in deployment.yaml
# now we can set dell.prod for pproduction apps (as for now all apps are dell.local)
# dnsConfig:
#   searches:

service:
  enabled: true
  type: ClusterIP
  labels: []
  http:
    port: 80
    targetPort: 8100
    protocol: TCP
    name: http
  #Only if you need one service to listen to two ports (Better to split that service to 2 mircoservices.)
  #Must be used with Multiple ingress paths.
  multiPortService:
    enabled: false
    http:
      port: 4999
      name: external
      targetPort: null

ingress:
  enabled: false
  #ALB Annotations: https://kubernetes-sigs.github.io/aws-load-balancer-controller/v2.2/guide/ingress/annotations/#annotations
  annotations: {}
  hosts:
  - path: /
    pathType: ImplementationSpecific

  multipath:
    enabled: false
    hosts:
    - paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          # serviceName: app1-service
          servicePort: 5000
      - path: /health
        pathType: ImplementationSpecific
        backend:
          # serviceName: app1-service
          servicePort: 5000
      - path: /config
        pathType: ImplementationSpecific
        backend:
          # serviceName: app1-service
          servicePort: 5000
      - path: /action
        pathType: ImplementationSpecific
        backend:
          # serviceName: app1-service
          servicePort: 5000

# Whether or not we want a pod disruption budget, enabled by default, but this only is enabled if replicaCount > 1
podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    memory: "1Gi"
    cpu: "0.5"
  limits:
    memory: "1Gi"
    cpu: "0.5"

# we should use only HPA OR Keda.
# if keda is needed plz use keda as the cpu\mem scaler
autoscaling: # Only one can be enabled
  minReplicas: 1
  maxReplicas: 2
  hpa:
    enabled: true
    metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          averageValue: 500m
          type: Utilization
    - type: Resource
      resource:
        name: memory
        target:
          averageValue: 500Mi
          type: Utilization


# criticalinfra = all our criticalinfra apps (namespace criticalinfra)
# infrastructure = internal tools(like devtools apps)
# dell = rest of dell microservices (exclude criticalinfra)
# only 1 selector will be selected!!
nodeSelector: {}
  # kubernetes.io/os: linux


# The folowing property is mandetory only for critical infra!!!
# tolerations: {}
tolerations: {}
  # - key: "app"
  #   operator: "Equal"
  #   value: "dell"
  # - key: "app"
  #   operator: "Equal"
  #   value: "dell-prod"


podAntiAffinity:
  enabled: false

topologySpreadConstraints: {}



# Create serviceaccount for the service
serviceAccount:
  enabled: false
  annotations: {}
    # Here's an example of assigning an IAM role to a pod
    # eks.amazonaws.com/role-arn: arn:aws:iam::123123123:role/role-name-goes-here

#Commit: DEVOPS-5837-FR-Hashmaps
hashcalculation:
  enabled: false
  # payerstolog: [248,371,444]

  ## Thirdparties
  # Set configurations for third party applications in this section
thirdParties:
  dynatraceVersionDetection:
    enabled: true
secrets:
  enabled: true
rest_service:
  config:
    manager:
      default_secrets_backend: vault
vault:
  host: edgevault
  port: 8200
  kvMountPath: "kv/eo/fusion-svc"
  appRolePath: "eo-approle"
  componentName: "fusion-svc"
  vaultSecretPath: /opt/vault/secret/

dbinit:
  postgres:
    name: dsp-secrets-service
    enabled: true
    dbName: "fusion_db"

postgresql:
  fullnameOverride: "postgresql"
